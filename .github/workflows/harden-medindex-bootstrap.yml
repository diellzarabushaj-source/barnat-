name: Harden MedIndex bootstrap

on:
  push:
    paths:
      - .github/workflows/harden-medindex-bootstrap.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify spreadsheet owner through Drive API
        shell: python
        run: |
          from pathlib import Path

          api = Path('api/drive-sync.js')
          text = api.read_text(encoding='utf-8')
          start = text.index('async function verifiedGoogleOwner')
          end = text.index('\nasync function bootstrapSecret', start)
          replacement = r'''async function verifiedGoogleOwner(req, payload = parseBody(req)) {
            const authorization = clean(req.headers?.authorization);
            const match = authorization.match(/^Bearer\s+(.+)$/i);
            if (!match) return '';
            const token = clean(match[1]);
            if (token.length < 40 || token.length > 4096) return '';

            const spreadsheetId = clean(payload.spreadsheetId);
            if (spreadsheetId !== CURRENT_DOSAGE_SPREADSHEET_ID) return '';

            const driveResponse = await fetch(
              `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(spreadsheetId)}`
                + '?fields=id%2CmimeType%2Cowners(emailAddress)%2Ccapabilities(canEdit)&supportsAllDrives=true',
              { headers:{ Authorization:`Bearer ${token}`, Accept:'application/json' } },
            );
            if (!driveResponse.ok) return '';
            const driveFile = await driveResponse.json().catch(() => ({}));
            const owners = Array.isArray(driveFile.owners)
              ? driveFile.owners.map(item => clean(item?.emailAddress).toLowerCase())
              : [];
            if (driveFile.id !== spreadsheetId) return '';
            if (driveFile.mimeType !== 'application/vnd.google-apps.spreadsheet') return '';
            if (driveFile.capabilities?.canEdit !== true) return '';
            if (!owners.includes(GOOGLE_SYNC_OWNER_EMAIL)) return '';

            const sheetResponse = await fetch(
              `https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(spreadsheetId)}`
                + '?fields=spreadsheetId%2Csheets.properties.title',
              { headers:{ Authorization:`Bearer ${token}`, Accept:'application/json' } },
            );
            if (!sheetResponse.ok) return '';
            const metadata = await sheetResponse.json().catch(() => ({}));
            const titles = Array.isArray(metadata.sheets)
              ? metadata.sheets.map(item => clean(item?.properties?.title))
              : [];
            if (metadata.spreadsheetId !== spreadsheetId) return '';
            if (![...DOSAGE_SHEETS].every(title => titles.includes(title))) return '';
            return GOOGLE_SYNC_OWNER_EMAIL;
          }
'''
          text = text[:start] + replacement + text[end:]
          api.write_text(text, encoding='utf-8')

          bootstrap = Path('google-apps-script/medindex-secret-bootstrap.gs')
          bootstrap.write_text(r'''// MedIndex one-click bootstrap.
          // Add this as Bootstrap.gs, then run setupMedIndexBootstrap once.
          'use strict';

          function setupMedIndexBootstrap() {
            const spreadsheet = SpreadsheetApp.getActiveSpreadsheet();
            if (!spreadsheet || spreadsheet.getId() !== '1T7XsfkXLQfEomFL4DmXoA8PheiR6s3Qmu36hTqklOMo') {
              throw new Error('Hape Apps Script nga spreadsheet-i MedIndex dhe provo përsëri.');
            }

            const file = DriveApp.getFileById(spreadsheet.getId());
            const ownerEmail = String(file.getOwner().getEmail() || '').trim().toLowerCase();
            if (ownerEmail !== 'diellzarabushaj@gmail.com') {
              throw new Error('Vetëm pronari i spreadsheet-it mund ta aktivizojë sinkronizimin.');
            }

            const response = UrlFetchApp.fetch('https://barnat-six.vercel.app/api/drive-sync', {
              method:'post',
              contentType:'application/json; charset=utf-8',
              headers:{ Authorization:`Bearer ${ScriptApp.getOAuthToken()}` },
              payload:JSON.stringify({
                action:'bootstrap_secret',
                spreadsheetId:spreadsheet.getId(),
                sheetName:'KARTELA_BARNAVE',
              }),
              muteHttpExceptions:true,
              followRedirects:true,
            });
            const status = response.getResponseCode();
            const body = JSON.parse(response.getContentText() || '{}');
            if (status < 200 || status >= 300 || !body.ok || !body.secret) {
              throw new Error(body.error || `Aktivizimi dështoi (${status}).`);
            }

            PropertiesService.getScriptProperties().setProperty('MEDINDEX_DRIVE_SYNC_SECRET', body.secret);
            setupMedIndexPerfectSync();
          }
          ''', encoding='utf-8')

      - name: Verify syntax
        shell: bash
        run: |
          node --check api/drive-sync.js
          cp google-apps-script/medindex-secret-bootstrap.gs /tmp/medindex-secret-bootstrap.js
          node --check /tmp/medindex-secret-bootstrap.js

      - name: Commit hardened bootstrap
        shell: bash
        run: |
          rm -f .github/workflows/harden-medindex-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/drive-sync.js google-apps-script/medindex-secret-bootstrap.gs .github/workflows/harden-medindex-bootstrap.yml
          git commit -m 'Verify Sheet owner through Google Drive bootstrap'
          git push origin HEAD:main
