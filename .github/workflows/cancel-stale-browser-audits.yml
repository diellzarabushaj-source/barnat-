name: Cancel stale browser audits

on:
  push:
    paths:
      - .github/workflows/cancel-stale-browser-audits.yml

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cancel stale physician browser runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/physician-browser-audit.yml/runs?branch=main&per_page=100" \
            --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress") | .id' \
            | while read -r run_id; do
                [ -n "$run_id" ] || continue
                gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null || true
              done
      - name: Remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/cancel-stale-browser-audits.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cancel-stale-browser-audits.yml
          git commit -m 'Remove stale browser audit helper'
          git push origin HEAD:main
