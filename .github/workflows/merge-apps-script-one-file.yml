name: Merge Apps Script into one file

on:
  push:
    paths:
      - .github/workflows/merge-apps-script-one-file.yml

permissions:
  contents: write

jobs:
  merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add one-click launcher to standalone script
        shell: python {0}
        run: |
          from pathlib import Path
          path = Path('google-apps-script/medindex-current-sync-standalone.gs')
          text = path.read_text(encoding='utf-8')
          marker = "function setupMedIndexPerfectSync()"
          launcher = r'''

function setupMedIndexPerfectSync() {
  medIndexRemoveLegacySyncTriggers_();
  setupMedIndexCurrentSyncStandalone();
}

function disableMedIndexPerfectSync() {
  medIndexRemoveLegacySyncTriggers_();
  disableMedIndexCurrentSyncStandalone();
}

function medIndexRemoveLegacySyncTriggers_() {
  const handlers = new Set([
    'medIndexDriveOnEdit',
    'medIndexDriveReconcile',
    'medIndexEditorPull',
    'medIndexCurrentDosageOnEdit',
    'medIndexCurrentDosageReconcile',
    'medIndexCurrentDosageEditorPull',
    'medIndexStandaloneOnEdit',
    'medIndexStandaloneReconcile',
    'medIndexStandaloneEditorPull',
  ]);
  ScriptApp.getProjectTriggers().forEach(trigger => {
    if (handlers.has(trigger.getHandlerFunction())) ScriptApp.deleteTrigger(trigger);
  });
}
'''
          if marker not in text:
              text = text.replace("'use strict';", "'use strict';" + launcher, 1)
          text = text.replace(".addItem('Aktivizo sinkronizimin', 'setupMedIndexCurrentSyncStandalone')", ".addItem('Aktivizo sinkronizimin', 'setupMedIndexPerfectSync')")
          text = text.replace(".addItem('Ndalo sinkronizimin', 'disableMedIndexCurrentSyncStandalone')", ".addItem('Ndalo sinkronizimin', 'disableMedIndexPerfectSync')")
          path.write_text(text, encoding='utf-8')
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/merge-apps-script-one-file.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google-apps-script/medindex-current-sync-standalone.gs .github/workflows/merge-apps-script-one-file.yml
          git commit -m 'Provide one-file Apps Script synchronization installer'
          git push origin HEAD:main
