name: Urgjencat V2 browser audit

on:
  pull_request:
    paths:
      - 'urgjencat.html'
      - 'urgjencat-v2.js'
      - 'urgjencat-v2.css'
      - 'drx-dashboard-stripe.css'
      - 'sidebar-taxonomy-v3.js'
      - 'tests/urgjencat-v2-browser.spec.js'
      - 'tests/clinical-smoke-server.js'
      - '.github/workflows/urgjencat-browser-v17.yml'
  push:
    branches: [main]
    paths:
      - 'urgjencat.html'
      - 'urgjencat-v2.js'
      - 'urgjencat-v2.css'
      - 'drx-dashboard-stripe.css'
      - 'sidebar-taxonomy-v3.js'
      - 'tests/urgjencat-v2-browser.spec.js'
      - 'tests/clinical-smoke-server.js'
      - '.github/workflows/urgjencat-browser-v17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bedside-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run current static Urgjencat contract
        run: node tests/urgjencat-doctor-workspace-test.js

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run focused Urgjencat V2 browser regression
        shell: bash
        run: |
          set -euo pipefail
          node tests/clinical-smoke-server.js > /tmp/urgjencat-v2-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/urgjencat-v2-browser-server.log' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/urgjencat.html >/dev/null; then break; fi
            sleep 1
          done
          pnpm exec playwright test tests/urgjencat-v2-browser.spec.js --reporter=line --workers=1 --retries=1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urgjencat-v2-browser-diagnostics
          path: |
            /tmp/urgjencat-v2-browser-server.log
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 3
