name: DRx Phase 8 shadow gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260830163000_drx_phase8_shadow_read_model_parity_core.sql"
      - "supabase/migrations/20260830163913_drx_phase8b_review_candidates_exit_gate_hardening.sql"
      - "supabase/migrations/20260830165007_drx_phase8c_product_source_review_evidence.sql"
      - "supabase/migrations/20260830165050_drx_phase8d_review_evidence_status_hardening.sql"
      - "supabase/migrations/20260830165536_drx_phase8e_cover_drx_foreign_keys.sql"
      - "supabase/migrations/20260830170022_drx_phase8f_exact_market_product_review_gate.sql"
      - "supabase/migrations/20260830170127_drx_phase8g_exact_product_status_contract.sql"
      - "supabase/migrations/20260830171643_drx_phase8h_published_v2_exact_source_discovery.sql"
      - "supabase/migrations/20260830171727_drx_phase8i_pilot_comparator_status_contract.sql"
      - "supabase/migrations/20260830201012_drx_phase8p_pilot_build_preflight.sql"
      - "supabase/migrations/20260830201638_drx_phase8q_search_index_hardening.sql"
      - "supabase/migrations/20260830202332_drx_phase8r_server_performance_probe.sql"
      - "supabase/migrations/20260830204339_drx_phase8s_exact_smpc_findings.sql"
      - "supabase/migrations/20260830204847_drx_phase8t_clinical_finding_review_control.sql"
      - "supabase/migrations/20260830205514_drx_phase8v_clinical_finding_snapshot_index.sql"
      - "supabase/migrations/20260830210058_drx_phase8w_pilot_clinical_provenance_bridge.sql"
      - "supabase/migrations/20260830210940_drx_phase8x_clinical_reference_finality_guard.sql"
      - "supabase/migrations/20260830211016_drx_phase8y_clinical_provenance_refresh.sql"
      - "supabase/migrations/20260830211052_drx_phase8x_provenance_scope_repair.sql"
      - "supabase/drx-phase8x-clinical-reference-finality-guard-rollback.sql"
      - "supabase/drx-phase8y-clinical-provenance-refresh-rollback.sql"
      - "supabase/drx-phase8x-provenance-scope-repair-rollback.sql"
      - "tests/drx-phase8-live-migration-reconciliation-test.js"
      - "supabase/drx-phase8w-pilot-clinical-provenance-bridge-rollback.sql"
      - "tests/drx-phase8-pilot-clinical-provenance-bridge-test.js"
      - "supabase/drx-phase8s-exact-smpc-findings-rollback.sql"
      - "supabase/drx-phase8t-clinical-finding-review-control-rollback.sql"
      - "supabase/drx-phase8v-clinical-finding-snapshot-index-rollback.sql"
      - "lib/dose-v3-shadow.js"
      - "lib/dose-product-fast-path-handler.js"
      - "tests/drx-phase8-shadow-runtime-test.js"
      - "tests/drx-phase8-pilot-build-preflight-test.js"
      - "tests/drx-phase8-performance-probe-test.js"
      - "tests/drx-phase8-exit-audit-test.js"
      - "tests/drx-phase8-clinical-finding-review-control-test.js"
      - "scripts/drx-phase8-status.js"
      - "scripts/drx-phase8-exit-audit.js"
      - "docs/DRX-PHASE8-ROLLBACK.md"
      - ".github/workflows/drx-phase8-shadow-gate.yml"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MEDINDEX_SUPABASE_URL: https://ftuchtmolddhhsdcwnqe.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Static Phase 8 shadow contract
        run: node tests/drx-phase8-shadow-runtime-test.js
      - name: Static Phase 8 pilot preflight contract
        run: node tests/drx-phase8-pilot-build-preflight-test.js
      - name: Static Phase 8 clinical finding review control
        run: node tests/drx-phase8-clinical-finding-review-control-test.js
      - name: Static Phase 8 pilot clinical provenance bridge
        run: node tests/drx-phase8-pilot-clinical-provenance-bridge-test.js
      - name: Static Phase 8 live migration reconciliation
        run: node tests/drx-phase8-live-migration-reconciliation-test.js
      - name: Static Phase 8 performance probe contract
        run: node tests/drx-phase8-performance-probe-test.js
      - name: Static Phase 8 exit audit contract
        run: node tests/drx-phase8-exit-audit-test.js
      - name: Live Phase 8 gate
        run: node scripts/drx-phase8-status.js
      - name: Live Phase 8 exit performance audit
        run: node scripts/drx-phase8-exit-audit.js
      - name: Upload Phase 8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: drx-phase8-status-evidence
          path: |
            drx-phase8-status-evidence.json
            drx-phase8-exit-audit-evidence.json
          if-no-files-found: error
          retention-days: 30
