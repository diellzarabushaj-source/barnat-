name: ICD Latin targeted test

on:
  push:
    branches:
      - data/icd-latin-complete-701

jobs:
  icd-latin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run ICD hierarchy test
        run: node tests/icd-full-hierarchy-test.js
