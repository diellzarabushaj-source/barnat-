name: Prescription notation debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  notation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run complete tests and capture output
        shell: bash
        run: |
          set +e
          npm test > full-test.log 2>&1
          echo $? > full-test.status
          set -e
      - name: Upload complete output
        uses: actions/upload-artifact@v4
        with:
          name: prescription-notation-full-debug
          path: |
            full-test.log
            full-test.status
          retention-days: 1
      - name: Fail when tests failed
        shell: bash
        run: test "$(cat full-test.status)" = "0"
