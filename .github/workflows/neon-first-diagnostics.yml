name: Neon-first diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Capture complete test output
        shell: bash
        run: |
          set +e
          npm test > neon-first-test.log 2>&1
          status=$?
          echo "EXIT_STATUS=$status" >> neon-first-test.log
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: neon-first-test-log
          path: neon-first-test.log
          retention-days: 3
