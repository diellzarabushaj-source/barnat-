name: ICD live Sheet audit

on:
  pull_request:
    paths:
      - 'lib/icd-**'
      - 'tests/icd-live-sheet-audit.js'
      - '.github/workflows/icd-live-sheet-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-icd-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit live ICD Sheet and clinical search safety
        run: node tests/icd-live-sheet-audit.js
