name: Harden column picker clamp

on:
  push:
    paths:
      - .github/workflows/harden-column-picker-clamp.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make picker self-contained and clamp with absolute offsets
        shell: python {0}
        run: |
          from pathlib import Path

          css_path = Path('registry-column-picker-tailwind.css')
          css = css_path.read_text(encoding='utf-8')
          marker = 'html[data-mi-page="barnat"] #colPanel.col-panel {\n  box-sizing: border-box !important;'
          universal = '\n'.join([
              'html[data-mi-page="barnat"] #colPanel.col-panel,',
              'html[data-mi-page="barnat"] #colPanel.col-panel *,',
              'html[data-mi-page="barnat"] #colPanel.col-panel *::before,',
              'html[data-mi-page="barnat"] #colPanel.col-panel *::after {',
              '  box-sizing: border-box;',
              '}',
              '',
          ])
          if universal.strip() not in css:
              if marker not in css:
                  raise SystemExit('Column picker CSS marker not found.')
              css = css.replace(marker, universal + marker, 1)
          css = css.replace('  translate: var(--mi-column-picker-shift-x, 0px) 0;\n', '', 1)
          css_path.write_text(css, encoding='utf-8')

          js_path = Path('registry-column-picker-tailwind.js')
          js = js_path.read_text(encoding='utf-8')
          js = js.replace('column-picker-tailwind-20260805-2', 'column-picker-tailwind-20260805-3')
          start = js.index('  function keepPanelInsideViewport(root) {')
          end = js.index('  function syncOpenState() {', start)
          helper = '\n'.join([
              '  function resetPanelPosition(root) {',
              "    root?.style.removeProperty('left');",
              "    root?.style.removeProperty('right');",
              '  }',
              '',
              '  function keepPanelInsideViewport(root) {',
              "    if (!root || !root.classList.contains('open')) return;",
              '    resetPanelPosition(root);',
              "    if (window.matchMedia('(max-width: 640px)').matches) return;",
              '    requestAnimationFrame(() => {',
              "      if (!root.classList.contains('open')) return;",
              '      const rect = root.getBoundingClientRect();',
              '      const parentRect = root.offsetParent?.getBoundingClientRect() || { left:0, right:window.innerWidth };',
              '      const margin = 12;',
              '      if (rect.left < margin) {',
              '        root.style.setProperty(\'left\', `${Math.round(margin - parentRect.left)}px`, \'important\');',
              "        root.style.setProperty('right', 'auto', 'important');",
              '      } else if (rect.right > window.innerWidth - margin) {',
              '        root.style.setProperty(\'right\', `${Math.round(parentRect.right - (window.innerWidth - margin))}px`, \'important\');',
              "        root.style.setProperty('left', 'auto', 'important');",
              '      }',
              '    });',
              '  }',
              '',
          ])
          js = js[:start] + helper + js[end:]
          js = js.replace("      root.style.removeProperty('--mi-column-picker-shift-x');", '      resetPanelPosition(root);', 1)
          js_path.write_text(js, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('registry-column-picker-tailwind.css?v=20260805-2', 'registry-column-picker-tailwind.css?v=20260805-3')
          index = index.replace('registry-column-picker-tailwind.js?v=20260805-2', 'registry-column-picker-tailwind.js?v=20260805-3')
          index_path.write_text(index, encoding='utf-8')

          test_path = Path('tests/column-picker-tailwind.spec.js')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('column-picker-tailwind-20260805-2', 'column-picker-tailwind-20260805-3')
          test = test.replace('registry-column-picker-tailwind.css?v=20260805-2', 'registry-column-picker-tailwind.css?v=20260805-3')
          test = test.replace('registry-column-picker-tailwind.js?v=20260805-2', 'registry-column-picker-tailwind.js?v=20260805-3')
          test_path.write_text(test, encoding='utf-8')

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check registry-column-picker-tailwind.js
          grep -q 'resetPanelPosition' registry-column-picker-tailwind.js
          grep -q '#colPanel.col-panel \*' registry-column-picker-tailwind.css
          rm -f .github/workflows/harden-column-picker-clamp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry-column-picker-tailwind.css registry-column-picker-tailwind.js index.html tests/column-picker-tailwind.spec.js .github/workflows/harden-column-picker-clamp.yml
          git commit -m 'Clamp the column picker with self-contained sizing'
          git push origin HEAD:main
