name: Fix dosage disclosure

on:
  push:
    paths:
      - .github/workflows/fix-dosage-full-text-disclosure.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply fix
        run: |
          python scripts/fix-dosage-full-text-disclosure.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/registry-dosage-columns-test.js')
          source = path.read_text(encoding='utf-8')
          source = source.replace("SRC = '\\/registry-dosage-columns-v2\\.js\\?v=20260728-2'", "SRC = '\\/registry-dosage-columns-v2\\.js\\?v=20260805-4'", 1)
          source = source.replace('registry-dosage-performance-v3', 'registry-dosage-performance-v4', 1)
          source = source.replace("assert.match(script, /registryDosageDisclosure/);", "assert.match(script, /registryDosageDisclosure/);\nassert.match(script, /rowController\\?\\.toggleRow|rowController\\.toggleRow/);", 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          node --check registry-dosage-columns-v2.js
          node --check registry-row-expand.js
          node --check registry-dosage-loader.js
          node tests/registry-cell-preview-test.js
          node tests/registry-table-final-test.js
          node tests/registry-dosage-columns-test.js
          pnpm test

      - name: Commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-dosage-full-text-disclosure.yml scripts/fix-dosage-full-text-disclosure.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Më shumë full dosage disclosure'
          git push origin HEAD:main
