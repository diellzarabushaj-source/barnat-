name: Fix dosage disclosure

on:
  push:
    paths:
      - .github/workflows/fix-dosage-full-text-disclosure.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply fix
        run: python scripts/fix-dosage-full-text-disclosure.py

      - name: Validate
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          node --check registry-dosage-columns-v2.js
          node --check registry-row-expand.js
          node --check registry-dosage-loader.js
          node tests/registry-cell-preview-test.js
          node tests/registry-table-final-test.js
          pnpm test

      - name: Commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-dosage-full-text-disclosure.yml scripts/fix-dosage-full-text-disclosure.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Më shumë full dosage disclosure'
          git push origin HEAD:main
