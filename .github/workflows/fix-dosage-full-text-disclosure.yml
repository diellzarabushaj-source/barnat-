name: Fix dosage disclosure

on:
  push:
    paths:
      - .github/workflows/fix-dosage-full-text-disclosure.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply fix
        run: |
          python scripts/fix-dosage-full-text-disclosure.py
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'registry-full-text-expansion.css?v=20260801-1':'registry-full-text-expansion.css?v=20260805-2',
              'registry-full-text-expansion\\.css\\?v=20260801-1':'registry-full-text-expansion\\.css\\?v=20260805-2',
              'registry-cell-preview.css?v=20260801-3':'registry-cell-preview.css?v=20260805-4',
              'registry-row-expand.js?v=20260801-4':'registry-row-expand.js?v=20260805-5',
              'registry-dosage-columns.css?v=20260728-2':'registry-dosage-columns.css?v=20260805-1',
              'registry-dosage-loader.js?v=20260728-2':'registry-dosage-loader.js?v=20260805-3',
              "SRC = '\\/registry-dosage-columns-v2\\.js\\?v=20260728-2'":"SRC = '\\/registry-dosage-columns-v2\\.js\\?v=20260805-4'",
              'registry-dosage-performance-v3':'registry-dosage-performance-v4',
              'data-registry-ui-release="20260801-14"':'data-registry-ui-release="20260805-15"',
              'registry-ui-20260801-14':'registry-ui-20260805-15',
          }
          for path in Path('tests').glob('*.js'):
              source = path.read_text(encoding='utf-8')
              updated = source
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if path.name == 'registry-dosage-columns-test.js' and 'rowController\\?\\.toggleRow|rowController\\.toggleRow' not in updated:
                  updated = updated.replace(
                      "assert.match(script, /registryDosageDisclosure/);",
                      "assert.match(script, /registryDosageDisclosure/);\nassert.match(script, /rowController\\?\\.toggleRow|rowController\\.toggleRow/);",
                      1,
                  )
              if updated != source:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Validate
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          node --check registry-dosage-columns-v2.js
          node --check registry-row-expand.js
          node --check registry-dosage-loader.js
          node tests/registry-cell-preview-test.js
          node tests/registry-table-final-test.js
          node tests/registry-dosage-columns-test.js
          pnpm test

      - name: Commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-dosage-full-text-disclosure.yml scripts/fix-dosage-full-text-disclosure.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Më shumë full dosage disclosure'
          git push origin HEAD:main
