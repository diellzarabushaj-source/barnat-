name: Add pediatric core substance reference

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-pediatric-core-reference.yml

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch Dozologjia
        run: python scripts/add-pediatric-core-reference.py
      - name: Verify Dozologjia
        run: node tests/dozologjia-v2-workspace-test.js
      - name: Require an explicit reviewed source change
        run: git diff --exit-code -- dozologjia.html
