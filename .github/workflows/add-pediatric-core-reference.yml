name: Add pediatric core substance reference

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-pediatric-core-reference.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch Dozologjia
        run: python scripts/add-pediatric-core-reference.py
      - name: Verify Dozologjia
        run: node tests/dozologjia-v2-workspace-test.js
      - name: Commit change
        run: |
          if git diff --quiet -- dozologjia.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dozologjia.html
          git commit -m "feat: add verified pediatric core substance dosing reference"
          git push origin HEAD:main
