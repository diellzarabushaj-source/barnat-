name: Phase 5 performance audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build audited runtime
        run: pnpm run build:runtime

      - name: Run Phase 0 static forensic gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-mobile-phase0.js --assert-phase0-ready --assert-phase1-ready --assert-phase2-ready | tee /tmp/mobile-phase0-static.log

      - name: Run mobile static performance contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/sidebar-atc-navigation-test.js
          node tests/global-search-atc-routing-test.js
          node tests/registry-mobile-phase5-test.js

      - name: Install Chromium and WebKit
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium webkit > /tmp/phase5-playwright-install.log 2>&1 || { tail -200 /tmp/phase5-playwright-install.log; exit 1; }

      - name: Run Phase 0 delayed-start single-owner gate
        shell: bash
        env:
          PHASE0_SKIP_BUILD: '1'
          # The production stall watch starts after authenticated-shell ownership
          # is resolved, not at navigation start. Keep the synthetic response
          # comfortably beyond 12s so this gate actually observes the diagnostic
          # stalled event while proving that it never wakes the full registry.
          PHASE0_MOBILE_SEARCH_DELAY_MS: '16000'
          PHASE0_MOBILE_STALL_THRESHOLD_MS: '12000'
        run: |
          set -euo pipefail
          node scripts/audit-mobile-phase0-runtime.js --assert-single-owner | tee /tmp/mobile-phase0-runtime.log

      - name: Run Phase 5 interaction, Phase 6 version and 4006-row performance gates
        shell: bash
        run: |
          set -euo pipefail
          node tests/clinical-smoke-server.js > /tmp/phase5-clinical-server.log 2>&1 &
          CLINICAL_SERVER_PID=$!
          node tests/registry-performance-server.js > /tmp/phase5-registry-server.log 2>&1 &
          REGISTRY_SERVER_PID=$!
          node tests/phase6-version-server.js > /tmp/phase6-version-server.log 2>&1 &
          PHASE6_SERVER_PID=$!
          trap 'kill "$CLINICAL_SERVER_PID" "$REGISTRY_SERVER_PID" "$PHASE6_SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4174/index.html >/dev/null && break
            sleep 1
          done
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4175/index.html?phase6=ready >/dev/null && break
            sleep 1
          done
          pnpm exec playwright test tests/phase5-final-performance.spec.js tests/phase6-single-version.spec.js tests/registry-main-thread-performance.spec.js --reporter=line --workers=1 --retries=1 | tee /tmp/phase5-performance.log

      - name: Run phone WebKit shell, network and startup gates
        shell: bash
        env:
          MOBILE_SHELL_SKIP_BUILD: '1'
          MOBILE_NETWORK_SKIP_BUILD: '1'
          MOBILE_STARTUP_SKIP_BUILD: '1'
        run: |
          set -euo pipefail
          node scripts/audit-mobile-density-diagnostic.js | tee /tmp/mobile-density-phase5.log
          node scripts/audit-mobile-shell-state.js | tee /tmp/mobile-shell-phase4.log
          node scripts/audit-mobile-network-phase5.js | tee /tmp/mobile-network-phase5.log
          node scripts/audit-mobile-startup-phase5.js | tee /tmp/mobile-startup-phase5.log

      - name: Upload Phase 0, Phase 5 and Phase 6 metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-phase5-phase6-performance-metrics
          path: |
            /tmp/mobile-phase0-static.log
            /tmp/mobile-phase0-runtime.log
            /tmp/phase5-performance.log
            /tmp/mobile-density-phase5.log
            /tmp/mobile-shell-phase4.log
            /tmp/mobile-network-phase5.log
            /tmp/mobile-startup-phase5.log
            /tmp/phase5-clinical-server.log
            /tmp/phase5-registry-server.log
            /tmp/phase6-version-server.log
            test-results
          if-no-files-found: warn
          retention-days: 7