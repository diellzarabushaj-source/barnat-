name: Apply post-merge cache coherence

on:
  pull_request:

permissions:
  contents: read

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'audit/post-merge-cache-coherence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply coherent production release token
        run: node scripts/apply-post-merge-cache-release.js

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run complete validation suite
        run: npm test

      - name: Package validated files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cache-release/files
          git diff --name-only --diff-filter=ACMRT > /tmp/cache-release/changed-files.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p "/tmp/cache-release/files/$(dirname "$file")"
            cp "$file" "/tmp/cache-release/files/$file"
          done < /tmp/cache-release/changed-files.txt
          git diff --binary > /tmp/cache-release/cache-release.patch
          test -s /tmp/cache-release/changed-files.txt
          cat /tmp/cache-release/changed-files.txt

      - name: Upload validated cache release
        uses: actions/upload-artifact@v4
        with:
          name: validated-cache-release
          path: /tmp/cache-release
          if-no-files-found: error
          retention-days: 3
