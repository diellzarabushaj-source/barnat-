name: Registry row actions build evidence

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-registry-row-actions-menu-phase*.js'
      - scripts/patch-registry-row-actions-first-render-aria.js
      - scripts/patch-registry-personal-final.js
      - scripts/audit-registry-row-actions-deployment.js
      - 'tests/registry-row-actions-menu-phase*.js'
      - tests/registry-row-actions-deployment-attestation-test.js
      - tests/registry-row-actions-release-api-test.js
      - 'release-markers/registry-row-actions-menu-phase*.txt'
      - api/clinical-editor.js
      - registry-user-personalization.js
      - registry-user-personalization.css
      - registry-desktop-lite.js
      - registry-unified-table.js
      - .github/workflows/registry-row-actions-build-evidence.yml
  pull_request:
    paths:
      - 'scripts/patch-registry-row-actions-menu-phase*.js'
      - scripts/patch-registry-row-actions-first-render-aria.js
      - scripts/patch-registry-personal-final.js
      - scripts/audit-registry-row-actions-deployment.js
      - 'tests/registry-row-actions-menu-phase*.js'
      - tests/registry-row-actions-deployment-attestation-test.js
      - tests/registry-row-actions-release-api-test.js
      - 'release-markers/registry-row-actions-menu-phase*.txt'
      - api/clinical-editor.js
      - registry-user-personalization.js
      - registry-user-personalization.css
      - registry-desktop-lite.js
      - registry-unified-table.js
      - .github/workflows/registry-row-actions-build-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Detect Registry V2
        id: registry
        shell: bash
        run: |
          if grep -q 'data-drx-app="registry-v2"' index.html; then
            echo "v2=true" >> "$GITHUB_OUTPUT"
          else
            echo "v2=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Syntax-check release evidence
        if: steps.registry.outputs.v2 != 'true'
        run: |
          node --check scripts/patch-registry-row-actions-menu-phase9-build-evidence.js
          node --check scripts/patch-registry-personal-final.js
          node --check scripts/audit-registry-row-actions-deployment.js
          node --check tests/registry-row-actions-menu-phase9-build-evidence-test.js
          node --check tests/registry-row-actions-deployment-attestation-test.js
          node --check tests/registry-row-actions-release-api-test.js
          node --check api/clinical-editor.js

      - name: Build final registry runtime and evidence
        run: pnpm run build:runtime

      - name: Verify Registry V2 build evidence
        if: steps.registry.outputs.v2 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-registry-v2.js
          node tests/registry-v2-contract-test.js
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const files = ['index.html','registry-v2.css','registry-v2.js'];
          const sha256 = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const evidence = {
            architecture:'registry-v2',
            sourceRevision:String(process.env.GITHUB_SHA || '').toLowerCase(),
            generatedAt:new Date().toISOString(),
            files:Object.fromEntries(files.map(file => [file, sha256(file)])),
          };
          fs.writeFileSync('registry-v2-build-evidence.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence, null, 2));
          NODE

      - name: Verify exact build evidence
        if: steps.registry.outputs.v2 != 'true'
        run: |
          node tests/registry-row-actions-menu-phase9-build-evidence-test.js
          node tests/registry-row-actions-deployment-attestation-test.js
          node tests/registry-row-actions-release-api-test.js
          node tests/hobby-deployment-budget-test.js
          node - <<'NODE'
          const fs = require('node:fs');
          const evidence = JSON.parse(fs.readFileSync('registry-row-actions-build-evidence.json', 'utf8'));
          const expected = String(process.env.GITHUB_SHA || '').toLowerCase();
          if (evidence.sourceRevision !== expected) {
            throw new Error(`Phase 9 sourceRevision mismatch: ${evidence.sourceRevision} !== ${expected}`);
          }
          console.log(`Phase 9 evidence bound to ${evidence.sourceRevision}`);
          NODE

      - name: Upload Registry V2 build evidence
        if: steps.registry.outputs.v2 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: registry-v2-build-evidence-${{ github.sha }}
          path: registry-v2-build-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload row-actions build evidence
        if: steps.registry.outputs.v2 != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: registry-row-actions-build-evidence-${{ github.sha }}
          path: |
            registry-row-actions-release.json
            registry-row-actions-build-evidence.json
          if-no-files-found: error
          retention-days: 30
