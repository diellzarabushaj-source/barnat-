name: DRx Phase 5 clinical variants gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260830160106_drx_phase5_clinical_variants_market_products.sql"
      - "tests/drx-phase5-clinical-variants-test.js"
      - "scripts/drx-phase5-status.js"
      - "docs/DRX-PHASE5-ROLLBACK.md"
      - ".github/workflows/drx-phase5-clinical-variants-gate.yml"

permissions:
  contents: read

concurrency:
  group: drx-phase5-clinical-variants-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MEDINDEX_SUPABASE_URL: https://ftuchtmolddhhsdcwnqe.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Static Phase 5 contract
        run: node tests/drx-phase5-clinical-variants-test.js

      - name: Live Phase 5 gate
        run: node scripts/drx-phase5-status.js

      - name: Upload Phase 5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: drx-phase5-status-evidence
          path: drx-phase5-status-evidence.json
          if-no-files-found: error
          retention-days: 30
