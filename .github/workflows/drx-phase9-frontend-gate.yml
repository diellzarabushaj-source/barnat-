name: DRx Phase 9 frontend gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260830220141_drx_phase9a_personal_entity_storage.sql"
      - "supabase/migrations/20260830220957_drx_phase9d_product_context.sql"
      - "supabase/migrations/20260830221548_drx_phase9e_frontend_foundation_status.sql"
      - "supabase/migrations/20260830223039_drx_phase9f_status_single_phase8_evaluation.sql"
      - "supabase/migrations/20260830224240_drx_phase9g_technical_qa_exit_evidence.sql"
      - "supabase/drx-phase9g-technical-qa-exit-evidence-rollback.sql"
      - "tests/drx-phase9-exit-evidence-test.js"
      - "supabase/drx-phase9f-status-single-phase8-evaluation-rollback.sql"
      - "supabase/drx-phase9a-personal-entity-storage-rollback.sql"
      - "supabase/drx-phase9d-product-context-rollback.sql"
      - "supabase/drx-phase9e-frontend-foundation-status-rollback.sql"
      - "lib/user-library.js"
      - "lib/pediatric-dosage-handler-core.js"
      - "user-library-client.js"
      - "phase9-personal-entities-client.js"
      - "dozologjia.html"
      - "dozologjia-v2.js"
      - "dozologjia-v2.css"
      - "data/drx-frontend-flow-contract-v1.json"
      - "scripts/drx-phase9-status.js"
      - "tests/drx-phase9-personal-entity-storage-test.js"
      - "tests/drx-phase9-personal-entity-sync-test.js"
      - "tests/drx-phase9-drawer-test.js"
      - "tests/dozologjia-v2-workspace-test.js"
      - "tests/drx-phase9-browser-qa-test.js"
      - "pediatric-calculator-client.js"
      - "tests/drx-phase9-product-context-test.js"
      - "tests/drx-phase9-status-test.js"
      - "tests/drx-phase9-prescription-context-test.js"
      - "tests/user-notes-native-storage-test.js"
      - "tests/user-library-account-isolation-test.js"
      - ".github/workflows/drx-phase9-frontend-gate.yml"

permissions:
  contents: read

jobs:
  phase9:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MEDINDEX_SUPABASE_URL: https://ftuchtmolddhhsdcwnqe.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Phase 9 personal entity storage
        run: node tests/drx-phase9-personal-entity-storage-test.js
      - name: Phase 9 personal entity sync
        run: node tests/drx-phase9-personal-entity-sync-test.js
      - name: Existing native note contract
        run: node tests/user-notes-native-storage-test.js
      - name: Existing account isolation contract
        run: node tests/user-library-account-isolation-test.js
      - name: Phase 9 clinical drawer
        run: node tests/drx-phase9-drawer-test.js
      - name: Phase 9 workspace regression
        run: node tests/dozologjia-v2-workspace-test.js
      - name: Phase 9 canonical product context
        run: node tests/drx-phase9-product-context-test.js
      - name: Phase 9 foundation status contract
        run: node tests/drx-phase9-status-test.js
      - name: Phase 9 final exit evidence
        run: node tests/drx-phase9-exit-evidence-test.js
      - name: Phase 9 prescription context
        run: node tests/drx-phase9-prescription-context-test.js
      - name: Live Phase 9 foundation gate
        run: node scripts/drx-phase9-status.js
      - name: Install Phase 9 browser QA
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium
      - name: Phase 9 browser QA — 390, 768, 1440
        run: node tests/drx-phase9-browser-qa-test.js
      - name: Upload Phase 9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: drx-phase9-foundation-evidence
          path: |
            drx-phase9-foundation-evidence.json
            drx-phase9-browser-evidence.json
            drx-phase9-browser-*.png
          if-no-files-found: error
          retention-days: 30
