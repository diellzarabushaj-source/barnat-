name: Phase 4 Supabase Auth

on:
  push:
    branches:
      - phase4-supabase-auth-rls-20260819
    paths:
      - 'lib/supabase-auth.js'
      - 'tests/supabase-auth-guards-test.js'
      - 'supabase/migrations/**'
      - '.github/workflows/phase4-supabase-auth.yml'
  pull_request:
    paths:
      - 'lib/supabase-auth.js'
      - 'tests/supabase-auth-guards-test.js'
      - 'supabase/migrations/**'
      - '.github/workflows/phase4-supabase-auth.yml'

permissions:
  contents: read

jobs:
  auth-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Phase 4 Auth guard tests
        run: node tests/supabase-auth-guards-test.js
