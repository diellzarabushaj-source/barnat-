name: Medical Hub chapter summary removal

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/medical-hub-remove-chapter-summaries.cjs'
      - '.github/workflows/medical-hub-chapter-summary-removal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: node scripts/medical-hub-remove-chapter-summaries.cjs
      - name: Validate JavaScript
        run: |
          node --check medical-hub-v2.js
          node --check api/medical-hub.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medical-hub-v2.js api/medical-hub.js
          git commit -m "fix: remove chapter summaries from Medical Hub navigation"
          git push
