name: Medical Hub chapter summary removal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/medical-hub-chapter-summary-removal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove selectable chapter summary documents from Medical Hub navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('medical-hub-v2.js')
          js = js_path.read_text()

          old = """  function preferredChapterItem(key) {
            const chapter = state.items.find(item => isChapter(item) && chapterKey(item) === key) || null;
            const lessons = chapterLessons(key);
            return lessons.length === 1 ? lessons[0] : chapter;
          }
          """
          new = """  function preferredChapterItem(key) {
            const chapter = state.items.find(item => isChapter(item) && chapterKey(item) === key) || null;
            const lessons = chapterLessons(key);
            return lessons[0] || chapter;
          }

          function chapterCatalog() {
            const byKey = new Map();
            state.items.forEach(item => {
              const key = chapterKey(item);
              if (!key) return;
              const existing = byKey.get(key);
              if (isChapter(item)) {
                byKey.set(key, {
                  key,
                  title:clean(item.title).replace(/^\\d+\\s*[—-]\\s*/, ''),
                  item,
                });
                return;
              }
              const title = clean(item.chapterTitle);
              if (!existing) {
                byKey.set(key, { key, title:title || `Kapitulli ${Number(key)}`, item });
              } else if ((!existing.title || /^Kapitulli \\d+$/.test(existing.title)) && title) {
                existing.title = title;
              }
            });
            return [...byKey.values()].sort((a,b) => Number(a.key) - Number(b.key));
          }
          """
          if old not in js:
            raise SystemExit('preferredChapterItem block not found')
          js = js.replace(old, new, 1)

          old = "const source = term ? candidates.filter(item => !isChapter(item)) : candidates;"
          if old not in js:
            raise SystemExit('filter source line not found')
          js = js.replace(old, "const source = candidates.filter(item => !isChapter(item));", 1)

          render_list = r'''  function renderList() {
            const select = $('#learningTopic');
            if (!select) {
              renderNavigationRails();
              return;
            }

            const term = clean(state.term);
            let options = '';

            if (!term && state.category) {
              const lessons = chapterLessons(state.category);
              options = lessons.map(item => `<option value="${esc(item._id)}">${esc(codedTitle(item))}</option>`).join('');
            } else {
              const grouped = new Map();
              state.filtered.forEach(item => {
                const key = chapterKey(item) || '00';
                if (!grouped.has(key)) grouped.set(key, []);
                grouped.get(key).push(item);
              });
              const catalog = new Map(chapterCatalog().map(entry => [entry.key, entry]));
              options = Array.from(grouped.entries()).map(([key, items]) => {
                const meta = catalog.get(key);
                const label = meta ? `Kapitulli ${Number(key)} — ${meta.title}` : `Kapitulli ${key}`;
                return `<optgroup label="${esc(label)}">${items.map(item => `<option value="${esc(item._id)}">${esc(codedTitle(item))}</option>`).join('')}</optgroup>`;
              }).join('');
            }

            select.innerHTML = options || '<option value="">Asnjë mësim</option>';
            select.value = state.selectedId;
            select.disabled = !options;
            renderNavigationRails();
          }

'''
          js, count = re.subn(r"  function renderList\(\) \{.*?\n  \}\n\n(?=  function renderReaderNavigation\(\))", render_list, js, count=1, flags=re.S)
          if count != 1:
            raise SystemExit(f'renderList replacement count={count}')

          js = js.replace(
            "const chapterCount = state.items.filter(isChapter).length;\n    const lessonCount = state.items.length - chapterCount;",
            "const chapterCount = chapterCatalog().length;\n    const lessonCount = state.items.filter(item => !isChapter(item)).length;",
            1,
          )

          old = """      else if (state.category) {
                const chapter = state.items.find(item => isChapter(item) && chapterKey(item) === state.category);
                const lessonTotal = state.items.filter(item => !isChapter(item) && chapterKey(item) === state.category).length;
                result.textContent = chapter ? `${lessonTotal} mësime në ${chapter.question || chapter.title}` : `${state.filtered.length} rezultate`;
              } else result.textContent = `${chapterCount} kapituj · ${lessonCount} mësime · burimi i publikuar`;
          """
          new = """      else if (state.category) {
                const meta = chapterCatalog().find(entry => entry.key === state.category);
                const lessonTotal = chapterLessons(state.category).length;
                result.textContent = meta ? `${lessonTotal} mësime në Kapitulli ${Number(state.category)} — ${meta.title}` : `${state.filtered.length} rezultate`;
              } else result.textContent = `${chapterCount} kapituj · ${lessonCount} mësime · burimi i publikuar`;
          """
          if old not in js:
            raise SystemExit('reader status block not found')
          js = js.replace(old, new, 1)

          old = """      const chapters = state.items.filter(isChapter);
              const category = $('#learningCategory');
              if (category) {
                category.innerHTML = '<option value="">Të gjithë kapitujt</option>'
                  + chapters.map(chapter => {
                    const number = chapterKey(chapter);
                    const title = clean(chapter.title).replace(/^\\d+\\s*[—-]\\s*/, '');
                    return `<option value="${number}">Kapitulli ${Number(number)} — ${esc(title)}</option>`;
                  }).join('');
              }

              state.category = chapters[0] ? chapterKey(chapters[0]) : '';
              state.selectedId = preferredChapterItem(state.category)?._id || chapters[0]?._id || state.items[0]?._id || '';
          """
          new = """      const chapters = chapterCatalog();
              const category = $('#learningCategory');
              if (category) {
                category.innerHTML = '<option value="">Të gjithë kapitujt</option>'
                  + chapters.map(chapter => `<option value="${chapter.key}">Kapitulli ${Number(chapter.key)} — ${esc(chapter.title)}</option>`).join('');
              }

              state.category = chapters[0]?.key || '';
              state.selectedId = preferredChapterItem(state.category)?._id || state.items.find(item => !isChapter(item))?._id || '';
          """
          if old not in js:
            raise SystemExit('init chapter block not found')
          js = js.replace(old, new, 1)
          js_path.write_text(js)

          api_path = Path('api/medical-hub.js')
          api = api_path.read_text()
          old = "contentKind, chapterNumber, lessonNumber, reviewStatus, reviewedBy, lastReviewedAt, version, sourceRxTitle,"
          new = "contentKind, chapterNumber, lessonNumber, chapterTitle, reviewStatus, reviewedBy, lastReviewedAt, version, sourceRxTitle,"
          if old not in api:
            raise SystemExit('legacy index projection not found')
          api = api.replace(old, new, 1)
          api_path.write_text(api)
          PY

          git rm .github/workflows/medical-hub-chapter-summary-removal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medical-hub-v2.js api/medical-hub.js
          git commit -m "fix: remove chapter summaries from Medical Hub navigation"
          git push
