name: DRx EMA Product Information Enrichment

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/drx-master-source-seed-chunk-*.json'
      - 'scripts/enrich-drx-master-ema.js'
      - '.github/workflows/drx-ema-enrichment.yml'

concurrency:
  group: drx-ema-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PDF text extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Validate syntax
        run: node --check scripts/enrich-drx-master-ema.js

      - name: Enrich from EMA public JSON and Product Information
        run: node scripts/enrich-drx-master-ema.js

      - name: Verify fail-closed output
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('data/drx-master-ema-enrichment-v1.json','utf8'));
          if(x.schemaVersion!=='drx-master-ema-enrichment-v1') throw new Error('wrong schema');
          if(x.policy?.publicationAllowed!==false) throw new Error('must remain fail-closed');
          if(x.policy?.crossStrengthBinding!==false) throw new Error('cross-strength must remain disabled');
          if(x.policy?.saltsAutoCollapsed!==false) throw new Error('salt collapse must remain disabled');
          const exact=x.rows.filter(r=>r.bestSource?.matchStatus==='EXACT_EMA_PI');
          const bad=exact.filter(r=>{
            const s=r.bestSource;
            return !s.activeEvidence||!s.strengthEvidence||!s.formEvidence||!s.section2Sha256||!s.section41Sha256||!s.section42Sha256;
          });
          if(bad.length) throw new Error('EMA exact matches missing required provenance: '+bad.length);
          console.log(JSON.stringify({rows:x.rows.length,counts:x.counts,exact:exact.length},null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: drx-ema-enrichment
          path: |
            data/drx-master-ema-enrichment-v1.json
            data/drx-master-ema-sheet-chunk-*.json
          retention-days: 30

      - name: Commit compact EMA enrichment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drx-master-ema-enrichment-v1.json data/drx-master-ema-sheet-chunk-*.json
          if git diff --cached --quiet; then
            echo "No EMA enrichment change."
            exit 0
          fi
          git commit -m "chore(drx): materialize EMA product-information enrichment"
          git pull --rebase origin main
          git push origin HEAD:main
