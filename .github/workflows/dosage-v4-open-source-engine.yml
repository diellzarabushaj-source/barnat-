name: Dosage v4 open-source engine

on:
  pull_request:
    paths:
      - 'lib/dosage-rule-engine-v4.js'
      - 'tests/dosage-rule-engine-v4-test.js'
      - 'third_party/DOSAGE-antibiotic-dose-validator-LICENSE.txt'
      - '.github/workflows/dosage-v4-open-source-engine.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/dosage-rule-engine-v4.js'
      - 'tests/dosage-rule-engine-v4-test.js'
      - 'third_party/DOSAGE-antibiotic-dose-validator-LICENSE.txt'

permissions:
  contents: read

jobs:
  dosage-v4-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check lib/dosage-rule-engine-v4.js
      - name: Rule engine contract
        run: node tests/dosage-rule-engine-v4-test.js
      - name: Existing pediatric calculator regression
        run: |
          node tests/pediatric-dosage-api-test.js
          node tests/pediatric-calculator-ui-test.js
