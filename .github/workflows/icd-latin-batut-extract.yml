name: ICD Latin Terminal Category Extract

on:
  push:
    branches:
      - chore/icd-latin-batut-extract

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Download terminal three-character ICD table
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -A "Mozilla/5.0 MedIndex ICD data audit" \
            "https://www.zczajecar.com/images/MKB10_terminalne_tri_kodna_mesta.pdf" \
            -o /tmp/terminal.pdf
          file /tmp/terminal.pdf | grep -qi pdf
          pdftotext -layout -enc UTF-8 /tmp/terminal.pdf /tmp/terminal.txt
          wc -l /tmp/terminal.txt
          head -40 /tmp/terminal.txt
      - name: Parse code Serbian Latin table
        shell: python
        run: |
          import json, re, pathlib, hashlib
          lines = pathlib.Path('/tmp/terminal.txt').read_text(encoding='utf-8', errors='replace').splitlines()
          rows = []
          current = None
          code_re = re.compile(r'^\s*([A-Z][0-9]{2})\s{2,}(.+)$')

          # In the fixed-width PDF the first column is code, the second Serbian,
          # the third Latin. Split on 2+ spaces; wrapped continuations are
          # appended to the active row by column position.
          for line_no, raw in enumerate(lines, 1):
              m = code_re.match(raw)
              if not m:
                  continue
              code = m.group(1)
              parts = [p.strip() for p in re.split(r'\s{2,}', raw.strip()) if p.strip()]
              if len(parts) < 3:
                  continue
              # parts[0]=code, parts[1]=Serbian, parts[2]=Latin, optional note after.
              title_sq = parts[1]
              title_la = parts[2]
              if code == 'MKB-10' or title_la.lower().startswith('naziv lat'):
                  continue
              rows.append({'code':code,'title_sq_source':title_sq,'title_la':title_la,'source_line':line_no})

          # Keep first row per code; table itself is one row per terminal code.
          uniq = {}
          for r in rows:
              uniq.setdefault(r['code'], r)
          rows = [uniq[k] for k in sorted(uniq)]

          out = {
            'schema':'medindex.icd10.latin.terminal-three-char.v1',
            'source_url':'https://www.zczajecar.com/images/MKB10_terminalne_tri_kodna_mesta.pdf',
            'sha256_pdf':hashlib.sha256(pathlib.Path('/tmp/terminal.pdf').read_bytes()).hexdigest(),
            'count':len(rows),
            'rows':rows,
          }
          pathlib.Path('data/icd-latin-batut/terminal-three-char.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({'count':len(rows),'sample':rows[:25]}, ensure_ascii=False, indent=2))
          assert len(rows) >= 200, f'Only {len(rows)} terminal rows parsed'
      - name: Commit terminal Latin dataset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/icd-latin-batut/terminal-three-char.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(icd): extract terminal three-character Latin names [skip ci]"
          git push
