name: ICD Latin Dataset Split

on:
  push:
    branches:
      - chore/icd-latin-batut-extract

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split extracted Batut dataset into reviewable chunks
        shell: python
        run: |
          import json, pathlib, collections, re
          src = pathlib.Path('data/icd-latin-batut-2010.json')
          data = json.loads(src.read_text(encoding='utf-8'))
          rows = data['rows']

          category_dir = pathlib.Path('data/icd-latin-batut/categories')
          all_dir = pathlib.Path('data/icd-latin-batut/all')
          category_dir.mkdir(parents=True, exist_ok=True)
          all_dir.mkdir(parents=True, exist_ok=True)

          categories = collections.defaultdict(list)
          all_rows = collections.defaultdict(list)
          for row in rows:
              code = row['code']
              if not re.fullmatch(r'[A-Z][0-9]{2}(?:\.[0-9A-Z]{1,2})?', code):
                  continue
              all_rows[code[0]].append(row)
              if re.fullmatch(r'[A-Z][0-9]{2}', code):
                  categories[code[0]].append(row)

          for letter, values in categories.items():
              (category_dir / f'{letter}.json').write_text(
                  json.dumps(values, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
              )
          for letter, values in all_rows.items():
              (all_dir / f'{letter}.json').write_text(
                  json.dumps(values, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
              )

          category_conflicts = []
          for conflict in data.get('conflicts', []):
              if re.fullmatch(r'[A-Z][0-9]{2}', conflict.get('code','')):
                  category_conflicts.append(conflict)
          pathlib.Path('data/icd-latin-batut/category-conflicts.json').write_text(
              json.dumps(category_conflicts, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          summary = {
              'source': data['source'],
              'counts': data['counts'],
              'category_conflicts': len(category_conflicts),
              'letters': {k: len(v) for k,v in sorted(categories.items())},
          }
          pathlib.Path('data/icd-latin-batut/summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
      - name: Commit chunks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/icd-latin-batut/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(icd): split Batut Latin dataset for import [skip ci]"
          git push
