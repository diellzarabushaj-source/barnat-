name: MedIndex validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app.js
            registry-parser-worker.js
            app-stability.js
            main-navigation-extension.js
            navigation-consistency.js
            tailadmin-shell.js
            tailadmin-shell-core.js
            tailadmin-professional.js
            medical-icons.js
            section-icons.js
            classification-icons.js
            prescription-format-core.js
            prescription-notation.js
            prescription-registry-bridge.js
            local-registry-fidelity.js
            dosage-engine.js
            signature-templates.js
            recetat.js
            api/auth.js
            api/gemini-prescription-secure.js
            api/drug-search.js
            api/registry.js
            api/dosage.js
            api/protocol-document.js
            lib/gemini-prescription.js
          )
          for file in "${files[@]}"; do
            test -f "$file"
            node --check "$file"
          done
          test ! -e api/gemini-prescription.js
          test ! -e api/registry-data.js
          cat app-parts/part-01.txt app-parts/part-02.txt app-parts/part-03.txt app-parts/part-04.txt app-parts/core-tail.txt > /tmp/medindex-registry-bundle.js
          node --check /tmp/medindex-registry-bundle.js

      - name: Run complete test suite
        run: pnpm test

      - name: Verify the dedicated prescription dashboard
        shell: bash
        run: |
          set -euo pipefail
          test -f recetat.html
          test -f recetat.css
          test -f recetat-audit.css
          test -f signature-templates.css
          test -f signature-templates.js
          test -f tests/signature-templates-test.js
          test -f tests/prescription-notation-test.js
          test -f tests/registry-source-fidelity-test.js
          test -f prescription-format-core.js
          test -f prescription-notation.js
          test -f prescription-registry-bridge.js
          test -f local-registry-fidelity.js
          test -f recetat.js
          test -f tailadmin-shell-core.js
          grep -q 'id="protocolsBtn"' index.html
          grep -q "href:'/recetat.html'" tailadmin-shell-core.js
          grep -q "label:'Recetat'" tailadmin-shell-core.js
          grep -q 'id="rxComposer"' recetat.html
          grep -q '@forma' recetat.html
          grep -q '@bari' recetat.html
          grep -q '@doza' recetat.html
          grep -q '@sasia' recetat.html
          grep -q '@tjetër' recetat.html
          grep -q '@signatura' recetat.html
          grep -q 'signature-templates.css' recetat.html
          grep -q 'signature-templates.js' recetat.html
          grep -q 'prescription-registry-bridge.js' recetat.html
          grep -q 'local-registry-fidelity.js' recetat.html
          grep -q 'Unguentum / krem' signature-templates.js
          grep -q 'Administrohet IV si infuzion' signature-templates.js
          grep -q 'prescription-format-core.js' recetat.html
          grep -q 'recetat.js' recetat.html
          grep -q 'id="rxGeneratedReview"' recetat.html
          ! grep -q 'recetat-v2.js' recetat.html
          grep -q '/api/gemini-prescription' recetat.js
          grep -q '/api/drug-search' recetat.js
          grep -q 'dispenseQuantity' prescription-format-core.js
          grep -q 'S (Signatura):' prescription-format-core.js
          grep -q 'sharedSignature' prescription-format-core.js
          grep -q 'generatedReviewConfirmed' recetat.js
          grep -q 'medindexPrescriptionSelection' recetat.js
          grep -q 'Si të shënohet në recetë' app-parts/part-01.txt
          grep -q 'PRESCRIPTION_SHEET_ID' api/registry.js
          grep -q 'matchedByOrdinal' api/registry.js
          grep -q 'ambiguousPdid' api/registry.js
          grep -q 'export?format=csv' api/registry.js
          grep -q 'packagingSummary' api/drug-search.js
          grep -q 'prescriptionLine' api/drug-search.js
          grep -q 'REGISTRY_SCHEMA_VERSION' local-registry-fidelity.js
          grep -q 'record.version !== REGISTRY_SCHEMA_VERSION' local-registry-fidelity.js
          grep -q 'local-registry-fidelity.js' sw.js
          ! grep -q 'protocolOverlay' index.html
          ! grep -q 'dosage-auto-apply.js' index.html
          ! grep -q 'prescription-review.js' index.html

      - name: Verify TailAdmin UI and navigation
        shell: bash
        run: |
          set -euo pipefail
          test -f tailadmin-medindex.css
          test -f tailadmin-shell.js
          test -f tailadmin-shell-core.js
          test -f tailadmin-professional.css
          test -f tailadmin-professional-core.css
          test -f tailadmin-professional.js
          test -f TAILADMIN-LICENSE
          test -f THIRD_PARTY_NOTICES.md
          test -f tests/ui-navigation-audit-test.js
          test -f tests/professional-ui-audit-test.js
          for page in index.html klasifikimi.html icd.html analizat.html dozologjia.html protokollet.html recetat.html; do
            grep -q 'medindex-tailadmin' "$page"
            grep -q 'tailadmin-medindex.css' "$page"
            grep -q 'tailadmin-professional.css' "$page"
            grep -q 'tailadmin-shell.js' "$page"
            grep -q 'tailadmin-professional.js' "$page"
            grep -q 'skip-link' "$page"
          done
          # The sign-in page was rebuilt on the DRx system, so it no longer sets
          # the medindex-tailadmin-login class or links the editorial stylesheets
          # (landing-effects.css is still applied, injected at runtime by
          # theme-preload.js). Assert the assets it actually owns instead.
          grep -q 'data-mi-page="login"' login.html
          grep -q 'theme-preload.js' login.html
          grep -q 'drx-auth.css' login.html
          grep -q 'plan-block' login.html
          grep -q -- '--mi-sidebar-width: 290px' tailadmin-medindex.css
          grep -q -- '--mi-brand-500: #1f7779' tailadmin-medindex.css
          grep -q -- '--mi-sidebar-width: 264px' tailadmin-professional-core.css
          grep -q 'html\[data-theme="dark"\]' tailadmin-medindex.css
          grep -q 'prefers-reduced-motion' tailadmin-medindex.css
          grep -q 'MOBILE_BREAKPOINT = 1024' tailadmin-shell-core.js
          grep -q 'data-mi-sidebar-toggle' tailadmin-shell-core.js
          grep -q 'aria-current="page"' tailadmin-shell-core.js
          grep -q 'MutationObserver' tailadmin-shell-core.js
          grep -q 'regjistriBarnave_theme_v1' tailadmin-shell-core.js
          grep -q 'CORE_SHELL_SRC' tailadmin-shell.js
          ! grep -q 'tailadmin-shell-legacy.js' index.html
          ! grep -q 'offline-runtime-performance.js' index.html
          grep -q 'TailAdmin Free Tailwind Dashboard Template' THIRD_PARTY_NOTICES.md
          ! grep -q 'installClinicalUi' app-stability.js
          ! grep -q 'clinical-ui.css' app-stability.js

      - name: Verify Gemini 3.6 clinical guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/gemini-prescription-audit-test.js
          test -f lib/gemini-prescription.js
          test -f api/gemini-prescription-secure.js
          test ! -e api/gemini-prescription.js
          grep -q "require('../lib/gemini-prescription.js')" api/gemini-prescription-secure.js
          grep -q "DEFAULT_MODEL = 'gemini-3.6-flash'" lib/gemini-prescription.js
          grep -q "DEFAULT_FALLBACK_MODEL = 'gemini-3.5-flash'" lib/gemini-prescription.js
          grep -q 'GEMINI_API_KEY' lib/gemini-prescription.js
          grep -q 'GOOGLE_API_KEY' lib/gemini-prescription.js
          grep -q 'v1/interactions' lib/gemini-prescription.js
          grep -q 'response_format' lib/gemini-prescription.js
          grep -q "mime_type: 'application/json'" lib/gemini-prescription.js
          grep -q 'thinking_level: THINKING_LEVEL' lib/gemini-prescription.js
          grep -q "thinking_summaries: 'none'" lib/gemini-prescription.js
          grep -q 'store: false' lib/gemini-prescription.js
          grep -q 'buildBaseline' lib/gemini-prescription.js
          grep -q 'buildTargets' lib/gemini-prescription.js
          grep -q 'mergeSuggestions' lib/gemini-prescription.js
          grep -q 'Mos shto, mos hiq, mos zëvendëso' lib/gemini-prescription.js
          ! grep -q 'temperature:' lib/gemini-prescription.js
          ! grep -q 'thinkingBudget' lib/gemini-prescription.js
