name: Phase 5 apply system health snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase5-apply-system-health-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  apply-phase5:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply Phase 5 migration with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail

          oidc_json="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=medindex-phase5-migration"
          )"

          oidc_token="$(
            python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$oidc_json"
          )"

          python - "$oidc_token" <<'PY'
          import base64, json, sys
          token=sys.argv[1]
          payload=token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          safe={k:claims.get(k) for k in ('iss','aud','sub','repository','ref','event_name','workflow_ref','job_workflow_ref')}
          print(json.dumps(safe, sort_keys=True))
          PY

          body_file="$(mktemp)"
          status="$(
            curl --silent --show-error \
              --output "$body_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${oidc_token}" \
              --header "Accept: application/json" \
              "https://ftuchtmolddhhsdcwnqe.supabase.co/functions/v1/phase5-migrate-once"
          )"

          cat "$body_file"
          printf '\nHTTP %s\n' "$status"
          test "$status" = "200"

          python -c '
          import json,sys
          payload=json.load(open(sys.argv[1]))
          assert payload.get("ok") is True, payload
          assert payload.get("version") == "20260829012500", payload
          ' "$body_file"
