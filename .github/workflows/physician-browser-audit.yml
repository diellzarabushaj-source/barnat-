name: Physician browser audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physician-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.54.1 > /tmp/playwright-install.log 2>&1 || { tail -200 /tmp/playwright-install.log; exit 1; }
          npx playwright install --with-deps chromium >> /tmp/playwright-install.log 2>&1 || { tail -200 /tmp/playwright-install.log; exit 1; }
          echo "Playwright Chromium installed."

      - name: Run physician workflow
        shell: bash
        run: |
          set -euo pipefail
          node tests/clinical-smoke-server.js > /tmp/medindex-clinical-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/medindex-clinical-server.log' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/physician-flow.spec.js --reporter=line --workers=1 > /tmp/physician-flow.log 2>&1 || { cat /tmp/physician-flow.log; exit 1; }
          cat /tmp/physician-flow.log

      - name: Upload physician diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physician-browser-diagnostics
          path: |
            /tmp/physician-flow.log
            /tmp/medindex-clinical-server.log
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 3
