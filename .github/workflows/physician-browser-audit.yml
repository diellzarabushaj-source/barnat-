name: Physician browser audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physician-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run static and clinical audit gates
        run: pnpm test

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1 || { tail -200 /tmp/playwright-install.log; exit 1; }
          echo "Playwright Chromium installed."

      - name: Run desktop, mobile, tablet, emergency, Phase 5 performance, CSP, landing, dose manual QA, cell preview and 4006-row audits
        shell: bash
        run: |
          set -euo pipefail
          test -s app-runtime.js || { echo "Generated app-runtime.js is missing."; exit 1; }
          test -s app-runtime-performance.js || { echo "Generated app-runtime-performance.js is missing."; exit 1; }
          node tests/clinical-smoke-server.js > /tmp/medindex-clinical-server.log 2>&1 &
          CLINICAL_SERVER_PID=$!
          node tests/registry-performance-server.js > /tmp/medindex-registry-performance-server.log 2>&1 &
          PERFORMANCE_SERVER_PID=$!
          trap 'kill "$CLINICAL_SERVER_PID" "$PERFORMANCE_SERVER_PID" 2>/dev/null || true; cat /tmp/medindex-clinical-server.log; cat /tmp/medindex-registry-performance-server.log' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/index.html >/dev/null; then break; fi
            sleep 1
          done
          : > /tmp/physician-flow.log
          pnpm exec playwright test tests/urgjencat-summary-learn-browser.spec.js tests/csp-browser-audit.spec.js tests/login-plan-card-browser.spec.js tests/physician-flow.spec.js tests/mobile-deep-audit.spec.js tests/registry-phone-hardening.spec.js tests/mobile-sidebar-deep-audit.spec.js tests/phase5-final-performance.spec.js tests/column-picker-tailwind.spec.js tests/registry-cell-preview.spec.js tests/registry-layout-regression.spec.js tests/dose-calculator-manual-qa-v2.spec.js tests/registry-main-thread-performance.spec.js --reporter=line --workers=1 --retries=1 >> /tmp/physician-flow.log 2>&1 || { cat /tmp/physician-flow.log; exit 1; }
          pnpm exec playwright test tests/atc-visual-audit.spec.js tests/icd-full-table-browser.spec.js tests/icd-advanced-search-browser.spec.js tests/icd-workspace-health-browser.spec.js tests/icd-terminology-detail-browser.spec.js tests/icd-prescription-roundtrip-browser.spec.js tests/icd-favorites-browser.spec.js tests/icd-problem-list-browser.spec.js tests/icd-coding-workspace-browser.spec.js tests/icd-code-comparison-browser.spec.js tests/icd-clinical-guidance-browser.spec.js tests/prescription-diagnosis-document-browser.spec.js tests/system-health-icd-browser.spec.js --reporter=line --workers=1 >> /tmp/physician-flow.log 2>&1 || { cat /tmp/physician-flow.log; exit 1; }
          cat /tmp/physician-flow.log

      - name: Upload physician diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physician-browser-diagnostics
          path: |
            /tmp/physician-flow.log
            /tmp/medindex-clinical-server.log
            /tmp/medindex-registry-performance-server.log
            /tmp/login-clinical-plan-*.png
            /tmp/dose-manual-qa
            /tmp/atc-visual
            /tmp/icd-visual
            /tmp/icd-clinical-guidance
            /tmp/prescription-document
            /tmp/system-health
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 3
