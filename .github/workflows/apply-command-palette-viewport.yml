name: Apply command palette viewport repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'audit/physician-product-hardening' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/physician-product-hardening
          fetch-depth: 0

      - name: Patch command palette positioning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('clinical-workflow.js')
          source = path.read_text()

          old_css = '.mi-global-search{position:relative}.mi-command-palette{position:absolute;top:calc(100% + 8px);left:0;right:0;'
          new_css = '.mi-global-search{position:relative}.mi-command-palette{position:fixed;top:var(--mi-command-top,74px);left:var(--mi-command-left,12px);right:auto;width:var(--mi-command-width,min(430px,calc(100vw - 24px)));'
          if source.count(old_css) != 1:
              raise SystemExit('Command palette CSS marker mismatch')
          source = source.replace(old_css, new_css, 1)

          close_marker = '''    const close = () => {
'''
          positioning = '''    const positionPalette = () => {
      if (palette.hidden) return;
      const rect = input.getBoundingClientRect();
      const gutter = 12;
      const availableWidth = Math.max(280, window.innerWidth - gutter * 2);
      const width = Math.min(Math.max(280, rect.width), availableWidth);
      const left = Math.min(Math.max(gutter, rect.left), Math.max(gutter, window.innerWidth - width - gutter));
      const estimatedHeight = Math.min(430, Math.max(180, window.innerHeight * 0.7));
      const roomBelow = window.innerHeight - rect.bottom - 8;
      const top = roomBelow >= 180
        ? rect.bottom + 8
        : Math.max(gutter, rect.top - estimatedHeight - 8);
      palette.style.setProperty('--mi-command-left', `${Math.round(left)}px`);
      palette.style.setProperty('--mi-command-top', `${Math.round(top)}px`);
      palette.style.setProperty('--mi-command-width', `${Math.round(width)}px`);
    };

    const close = () => {
'''
          if source.count(close_marker) != 1:
              raise SystemExit('Command palette close marker mismatch')
          source = source.replace(close_marker, positioning, 1)

          open_marker = '''      palette.hidden = false;
      input.setAttribute('aria-expanded', 'true');
'''
          open_replacement = '''      palette.hidden = false;
      positionPalette();
      input.setAttribute('aria-expanded', 'true');
'''
          if source.count(open_marker) != 1:
              raise SystemExit('Command palette open marker mismatch')
          source = source.replace(open_marker, open_replacement, 1)

          listener_marker = '''    document.addEventListener('click', event => { if (!host.contains(event.target)) close(); });
  }
'''
          listener_replacement = '''    document.addEventListener('click', event => { if (!host.contains(event.target)) close(); });
    window.addEventListener('resize', positionPalette, { passive:true });
    document.querySelector('.mi-main')?.addEventListener('scroll', positionPalette, { passive:true });
  }
'''
          if source.count(listener_marker) != 1:
              raise SystemExit('Command palette listener marker mismatch')
          source = source.replace(listener_marker, listener_replacement, 1)

          path.write_text(source)
          PY

      - name: Validate product
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-command-palette-viewport.yml .command-palette-viewport-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Keep clinical command palette inside viewport [palette-viewport-applied]"
          git push origin HEAD:audit/physician-product-hardening
