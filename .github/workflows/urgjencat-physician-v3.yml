name: Urgjencat V2 physician contract

on:
  pull_request:
    paths:
      - 'urgjencat.html'
      - 'urgjencat-v2.js'
      - 'urgjencat-v2.css'
      - 'drx-dashboard-stripe.css'
      - 'sidebar-taxonomy-v3.js'
      - 'sanity-clinical-client.js'
      - 'tests/urgjencat-doctor-workspace-test.js'
      - '.github/workflows/urgjencat-physician-v3.yml'
  push:
    branches: [main]
    paths:
      - 'urgjencat.html'
      - 'urgjencat-v2.js'
      - 'urgjencat-v2.css'
      - 'drx-dashboard-stripe.css'
      - 'sidebar-taxonomy-v3.js'
      - 'sanity-clinical-client.js'
      - 'tests/urgjencat-doctor-workspace-test.js'
      - '.github/workflows/urgjencat-physician-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Urgjencat V2 workspace contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check current runtime syntax
        run: node --check urgjencat-v2.js && node --check sidebar-taxonomy-v3.js
      - name: Run current physician workspace contract
        run: node tests/urgjencat-doctor-workspace-test.js
