name: Urgjencat Physician UX v7

on:
  pull_request:
    paths:
      - 'urgjencat.html'
      - 'emergency-doctor-ux-v2.js'
      - 'emergency-doctor-keyboard-v2.js'
      - 'emergency-doctor-ux-v3.js'
      - 'emergency-doctor-ux-v3.css'
      - 'emergency-summary-learn.js'
      - 'emergency-learning-v4.js'
      - 'emergency-learning-v4.css'
      - 'emergency-trainers-v5.js'
      - 'emergency-trainers-v5.css'
      - 'emergency-readiness-v6.js'
      - 'emergency-readiness-v6.css'
      - 'emergency-smart-search-v7.js'
      - 'emergency-smart-search-v7.css'
      - 'tests/urgjencat-doctor-v3-test.js'
      - '.github/workflows/urgjencat-physician-v3.yml'
  push:
    branches:
      - main
    paths:
      - 'urgjencat.html'
      - 'emergency-doctor-ux-v3.js'
      - 'emergency-doctor-ux-v3.css'
      - 'emergency-learning-v4.js'
      - 'emergency-learning-v4.css'
      - 'emergency-trainers-v5.js'
      - 'emergency-trainers-v5.css'
      - 'emergency-readiness-v6.js'
      - 'emergency-readiness-v6.css'
      - 'emergency-smart-search-v7.js'
      - 'emergency-smart-search-v7.css'
      - 'tests/urgjencat-doctor-v3-test.js'

permissions:
  contents: read

jobs:
  contract:
    name: Physician UX v7 contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Urgjencat v7 regression contract
        run: node tests/urgjencat-doctor-v3-test.js
