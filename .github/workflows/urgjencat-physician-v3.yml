      - 'tests/emergency-search-quality-v10-test.js'
      - 'tests/emergency-search-quality-v11-test.js'
      - 'tests/emergency-action-search-v12-test.js'
      - 'tests/emergency-action-deeplink-v13-test.js'
      - 'tests/emergency-verification-queue-v14-test.js'
      - 'tests/emergency-consistency-v15-test.js'
      - 'tests/emergency-evidence-v16-test.js'
      - 'tests/emergency-memory-v21-test.js'

permissions:
  contents: read

jobs:
  contract:
    name: Physician UX v21 contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Urgjencat regression contract
        run: node tests/urgjencat-doctor-v3-test.js
      - name: Run guided learning flow v7 contract
        run: node tests/urgjencat-learning-flow-v7-test.js
      - name: Run multi-symptom chips v9 contract
        run: node tests/urgjencat-symptom-chips-v9-test.js
      - name: Run search quality v10 benchmark
        run: node tests/emergency-search-quality-v10-test.js
      - name: Run physician search quality v11 benchmark
        run: node tests/emergency-search-quality-v11-test.js
      - name: Run governed action search v12 contract
        run: node tests/emergency-action-search-v12-test.js
      - name: Run governance-aware deep-link readiness v13 contract
        run: node tests/emergency-action-deeplink-v13-test.js
      - name: Run clinical verification queue v14 contract
        run: node tests/emergency-verification-queue-v14-test.js
      - name: Run deterministic consistency guard v15 contract
        run: node tests/emergency-consistency-v15-test.js
      - name: Run evidence traceability and lazy review v16 contract
        run: node tests/emergency-evidence-v16-test.js
      - name: Run evidence-informed memory loop v21 contract
        run: node tests/emergency-memory-v21-test.js
