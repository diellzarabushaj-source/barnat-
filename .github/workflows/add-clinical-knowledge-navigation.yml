name: Add clinical knowledge navigation

on:
  push:
    paths:
      - .github/workflows/add-clinical-knowledge-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard navigation and offline shell
        shell: python {0}
        run: |
          from pathlib import Path
          import re

          def edit(path, transform):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              updated = transform(text)
              if updated == text:
                  print(f'No change needed: {path}')
              file.write_text(updated, encoding='utf-8')

          def add_before(text, marker, addition, guard):
              if guard in text:
                  return text
              if marker not in text:
                  raise SystemExit(f'Marker not found: {marker[:80]}')
              return text.replace(marker, addition + marker, 1)

          def replace_once(text, old, new):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'Marker not found: {old[:80]}')
              return text.replace(old, new, 1)

          def patch_extension(text):
              text = add_before(text,
                  "    {\n      id:'labs', href:'analizat.html', title:'Analizat',",
                  "    {\n      id:'emergencies', href:'urgjencat.html', title:'Urgjencat',\n      icon:'<svg fill=\"none\" viewBox=\"0 0 256 256\" aria-hidden=\"true\"><path d=\"M128 28 228 210H28L128 28Z\" stroke=\"currentColor\" stroke-width=\"16\" stroke-linejoin=\"round\"/><path d=\"M128 88v58M128 180h.1\" stroke=\"currentColor\" stroke-width=\"16\" stroke-linecap=\"round\"/></svg>'\n    },\n",
                  "id:'emergencies'")
              text = add_before(text,
                  "    {\n      id:'clinical-protocols', href:'protokollet.html', title:'Protokollet',",
                  "    {\n      id:'learning', href:'medical-hub.html', title:'Medical Hub',\n      icon:'<svg fill=\"none\" viewBox=\"0 0 256 256\" aria-hidden=\"true\"><path d=\"M44 48h72a28 28 0 0 1 28 28v132H72a28 28 0 0 0-28 28V48Z\" stroke=\"currentColor\" stroke-width=\"16\"/><path d=\"M212 48h-40a28 28 0 0 0-28 28v132h40a28 28 0 0 1 28 28V48Z\" stroke=\"currentColor\" stroke-width=\"16\"/></svg>'\n    },\n",
                  "id:'learning'")
              return text

          def patch_legacy(text):
              text = add_before(text,
                  "    '/analizat.html': ['Analizat laboratorike', 'Referencë klinike e strukturuar'],",
                  "    '/urgjencat.html': ['Urgjencat', 'Hapa të shpejtë, referim dhe kujdes sekondar'],\n",
                  "'/urgjencat.html'")
              text = add_before(text,
                  "    '/recetat.html': ['Recetat', 'Krijim, kontroll dhe ruajtje e recetave'],",
                  "    '/medical-hub.html': ['Medical Hub', 'Pyetje klinike, trajtim hap pas hapi dhe receta'],\n",
                  "'/medical-hub.html'")
              text = add_before(text,
                  "    labs: '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">",
                  "    emergencies: '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3 22 21H2L12 3Z\"/><path d=\"M12 9v5M12 17h.01\"/></svg>',\n    learning: '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 4h6a3 3 0 0 1 3 3v13H7a3 3 0 0 0-3 3V4Z\"/><path d=\"M20 4h-4a3 3 0 0 0-3 3v13h4a3 3 0 0 1 3 3V4Z\"/></svg>',\n",
                  "emergencies: '<svg")
              if "emergencies: ['/urgjencat.html']" not in text:
                  text = re.sub(r"(\n\s*icd:\s*\['/icd\.html'\],)", r"\1\n      emergencies: ['/urgjencat.html'],", text, count=1)
              if "learning: ['/medical-hub.html']" not in text:
                  text = re.sub(r"(\n\s*'clinical-protocols':\s*\['/protokollet\.html'\],)", r"\1\n      learning: ['/medical-hub.html'],", text, count=1)
              text = add_before(text,
                  "        ${navItem({ id:'labs', href:'/analizat.html', label:'Analizat', icon:ICONS.labs })}",
                  "        ${navItem({ id:'emergencies', href:'/urgjencat.html', label:'Urgjencat', icon:ICONS.emergencies })}\n",
                  "id:'emergencies', href:'/urgjencat.html'")
              text = add_before(text,
                  "        ${navItem({ id:'prescriptions', href:'/recetat.html', label:'Recetat', icon:ICONS.prescriptions })}",
                  "        ${navItem({ id:'learning', href:'/medical-hub.html', label:'Medical Hub', icon:ICONS.learning })}\n",
                  "id:'learning', href:'/medical-hub.html'")
              return text

          def patch_shell(text):
              text = add_before(text, "    '/protokollet.html':['Protokollet'],", "    '/urgjencat.html':['Urgjencat'],\n", "'/urgjencat.html'")
              text = add_before(text, "    '/recetat.html':['Recetat'],", "    '/medical-hub.html':['Medical Hub'],\n", "'/medical-hub.html'")
              text = replace_once(text,
                  "'#dosageSearch', '#protocolSearch', '#rxDrugSearch']",
                  "'#dosageSearch', '#emergencySearch', '#protocolSearch', '#learningSearch', '#rxDrugSearch']")
              return text

          def patch_professional(text):
              text = add_before(text, "    '/analizat.html':'analizat',", "    '/urgjencat.html':'urgjencat',\n", "'/urgjencat.html'")
              text = add_before(text, "    '/recetat.html':'recetat',", "    '/medical-hub.html':'medical-hub',\n", "'/medical-hub.html'")
              return text

          def patch_tests(text):
              text = add_before(text, "  ['analizat.html', 'labContent'],", "  ['urgjencat.html', 'emergencyContent'],\n", "['urgjencat.html', 'emergencyContent']")
              text = add_before(text, "  ['recetat.html', 'rxContent'],", "  ['medical-hub.html', 'medicalHubContent'],\n", "['medical-hub.html', 'medicalHubContent']")
              text = add_before(text, "  /\\/protokollet\\.html/,", "  /\\/urgjencat\\.html/,\n", "/\\/urgjencat\\.html/")
              text = add_before(text, "  /\\/recetat\\.html/,", "  /\\/medical-hub\\.html/,\n", "/\\/medical-hub\\.html/")
              return text

          def patch_sw(text):
              text = re.sub(r"const CACHE_EPOCH = '[^']+';", "const CACHE_EPOCH = 'clinical-knowledge-20260805-1';", text, count=1)
              text = replace_once(text,
                  "  '/dozologjia.html', '/protokollet.html', '/recetat.html', '/login.html',",
                  "  '/dozologjia.html', '/urgjencat.html', '/protokollet.html', '/medical-hub.html', '/recetat.html', '/login.html',")
              text = replace_once(text,
                  "  '/tailadmin-professional.css', '/medical-hub.css', '/clinical-density.css',",
                  "  '/tailadmin-professional.css', '/medical-hub.css', '/clinical-knowledge.css', '/clinical-density.css',")
              text = replace_once(text,
                  "  '/dozologjia-deep-audit.js', '/protokollet.js',",
                  "  '/dozologjia-deep-audit.js', '/sanity-clinical-client.js', '/urgjencat.js', '/medical-hub.js', '/protokollet.js',")
              return text

          edit('main-navigation-extension.js', patch_extension)
          edit('tailadmin-shell-legacy.js', patch_legacy)
          edit('tailadmin-shell.js', patch_shell)
          edit('tailadmin-professional.js', patch_professional)
          edit('tests/ui-navigation-audit-test.js', patch_tests)
          edit('sw.js', patch_sw)

      - name: Validate files
        shell: bash
        run: |
          set -euo pipefail
          node --check main-navigation-extension.js
          node --check tailadmin-shell.js
          node --check tailadmin-shell-legacy.js
          node --check tailadmin-professional.js
          node --check sanity-clinical-client.js
          node --check urgjencat.js
          node --check medical-hub.js
          node --check sw.js
          node tests/ui-navigation-audit-test.js

      - name: Commit integrated pages
        shell: bash
        run: |
          rm -f .github/workflows/add-clinical-knowledge-navigation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main-navigation-extension.js tailadmin-shell.js tailadmin-shell-legacy.js tailadmin-professional.js tests/ui-navigation-audit-test.js sw.js .github/workflows/add-clinical-knowledge-navigation.yml
          git commit -m 'Integrate Emergencies and Medical Hub navigation'
          git push origin HEAD:main
