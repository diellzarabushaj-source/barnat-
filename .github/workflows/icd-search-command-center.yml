name: ICD search command center

on:
  push:
    paths:
      - 'icd.html'
      - 'icd-v2.css'
      - 'icd-v2.js'
      - 'icd-search-lexical.js'
      - 'runtime-asset-manifest.json'
      - 'lib/icd-*.js'
      - 'data/icd-latin-*.json'
      - 'data/icd-symptom-*.json'
      - 'data/icd-qkmf-hot-*.json'
      - 'data/icd-primary-care-action-*.json'
      - 'tests/icd-clinical-search-v3-test.js'
      - 'tests/icd-symptom-intent-test.js'
      - 'tests/icd-hot-search-test.js'
      - 'tests/icd-primary-care-action-test.js'
      - 'tests/icd-search-command-center-test.js'
      - 'tests/icd-description-*.js'
      - 'tests/icd-ai-provider-test.js'
      - 'tests/icd-search-resilience-test.js'
      - '.github/workflows/icd-search-command-center.yml'
  pull_request:
    paths:
      - 'icd.html'
      - 'icd-v2.css'
      - 'icd-v2.js'
      - 'icd-search-lexical.js'
      - 'runtime-asset-manifest.json'
      - 'lib/icd-*.js'
      - 'data/icd-latin-*.json'
      - 'data/icd-symptom-*.json'
      - 'data/icd-qkmf-hot-*.json'
      - 'data/icd-primary-care-action-*.json'
      - 'tests/icd-clinical-search-v3-test.js'
      - 'tests/icd-symptom-intent-test.js'
      - 'tests/icd-hot-search-test.js'
      - 'tests/icd-primary-care-action-test.js'
      - 'tests/icd-search-command-center-test.js'
      - 'tests/icd-description-*.js'
      - 'tests/icd-ai-provider-test.js'
      - 'tests/icd-search-resilience-test.js'
      - '.github/workflows/icd-search-command-center.yml'

jobs:
  search-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check icd-v2.js
          node --check lib/icd-search-engine.js
          node --check lib/icd-search-engine-v3.js
          node --check lib/icd-symptom-intent.js
          node --check lib/icd-advanced-handler.js
          node --check lib/icd-ai-provider.js
          node --check lib/icd-description-search.js
      - name: Search engine tests
        run: |
          node tests/icd-clinical-search-v3-test.js
          node tests/icd-symptom-intent-test.js
          node tests/icd-hot-search-test.js
          node tests/icd-primary-care-action-test.js
          node tests/icd-search-command-center-test.js
          node tests/icd-lexical-relevance-test.js
          node tests/icd-description-search-test.js
          node tests/icd-description-evidence-test.js
          node tests/icd-description-clarification-test.js
          node tests/icd-ai-provider-test.js
          node tests/icd-search-resilience-test.js
