name: Mobile WebKit audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-webkit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build audited runtime once
        run: pnpm run build:runtime

      - name: Verify Registry V2 WebKit audit syntax
        run: |
          node --check tests/clinical-smoke-server.js
          node --check tests/registry-v2-browser.spec.js
          node --check playwright.registry-v2.config.js

      - name: Install Playwright WebKit
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps webkit > /tmp/playwright-webkit-install.log 2>&1 || { tail -200 /tmp/playwright-webkit-install.log; exit 1; }
          echo "Playwright WebKit installed."

      - name: Run current Registry V2 phone, tablet and desktop WebKit gates
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/mobile-webkit-audit.log
          PORT=4173 node tests/clinical-smoke-server.js > /tmp/registry-v2-webkit-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/registry-v2-webkit-server.log
              exit 1
            fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null
          pnpm exec playwright test tests/registry-v2-browser.spec.js \
            --config=playwright.registry-v2.config.js \
            --project=webkit 2>&1 | tee -a /tmp/mobile-webkit-audit.log

      - name: Upload WebKit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-tablet-webkit-diagnostics
          path: |
            /tmp/mobile-webkit-audit.log
            /tmp/registry-v2-webkit-server.log
            /tmp/playwright-webkit-install.log
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 3
