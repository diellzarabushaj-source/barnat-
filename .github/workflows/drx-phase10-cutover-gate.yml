name: DRx Phase 10 cutover gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260830230458_drx_phase10a_cutover_control_and_legacy_write_audit.sql"
      - "supabase/migrations/20260830231042_drx_phase10b_controlled_traffic_plumbing.sql"
      - "supabase/migrations/20260830231548_drx_phase10c_golden_and_parity_evidence.sql"
      - "supabase/migrations/20260831045759_drx_phase10a_cutover_control_plane.sql"
      - "supabase/migrations/20260831050214_drx_phase10d_reconcile_parallel_control_plane.sql"
      - "supabase/migrations/20260831050641_drx_phase10e_security_and_legacy_write_evidence.sql"
      - "supabase/migrations/20260831051258_drx_phase10f_controlled_rollback_drill.sql"
      - "supabase/migrations/20260831051755_drx_phase10g_stable_traffic_bucket.sql"
      - "supabase/migrations/20260831052414_drx_phase10h_controlled_soak_start.sql"
      - "supabase/migrations/20260831052948_drx_phase10i_soak_observability.sql"
      - "supabase/migrations/20260831053832_drx_phase10j_pediatric_v3_calculator_metadata.sql"
      - "supabase/migrations/20260831060712_drx_phase10k_restore_test_evidence.sql"
      - "data/drx-phase10k-restore-test-evidence-v1.json"
      - "tests/drx-phase10k-restore-test-evidence-test.js"
      - "supabase/drx-phase10h-controlled-soak-start-rollback.sql"
      - "supabase/drx-phase10i-soak-observability-rollback.sql"
      - "supabase/drx-phase10j-pediatric-v3-calculator-metadata-rollback.sql"
      - "tests/drx-phase10-pediatric-v3-metadata-rpc-test.js"
      - "supabase/migration-history.json"
      - "tests/drx-phase10-controlled-soak-start-test.js"
      - "supabase/drx-phase10g-stable-traffic-bucket-rollback.sql"
      - "tests/drx-phase10-stable-traffic-bucket-test.js"
      - "supabase/drx-phase10f-controlled-rollback-drill-rollback.sql"
      - "tests/drx-phase10-rollback-drill-test.js"
      - "supabase/drx-phase10e-security-and-legacy-write-evidence-rollback.sql"
      - "tests/drx-phase10-security-write-evidence-test.js"
      - "supabase/drx-phase10a-parallel-cutover-control-plane-rollback.sql"
      - "supabase/drx-phase10d-reconcile-parallel-control-plane-rollback.sql"
      - "tests/drx-phase10-control-plane-reconciliation-test.js"
      - "supabase/drx-phase10c-golden-and-parity-evidence-rollback.sql"
      - "tests/drx-phase10-golden-parity-evidence-test.js"
      - "supabase/drx-phase10b-controlled-traffic-plumbing-rollback.sql"
      - "lib/dose-v3-cutover-control.js"
      - "tests/drx-phase10-controlled-traffic-test.js"
      - "lib/pediatric-v3-runtime.js"
      - "lib/pediatric-dosage-handler-core.js"
      - "dozologjia.html"
      - "dozologjia-v2.js"
      - "pediatric-calculator-client.js"
      - "tests/drx-phase10-pediatric-v3-calculator-test.js"
      - "scripts/drx-phase10-pediatric-v3-live.js"
      - "supabase/drx-phase10a-cutover-control-and-legacy-write-audit-rollback.sql"
      - "scripts/drx-phase10-status.js"
      - "scripts/drx-phase10-controlled-canary.js"
      - "tests/drx-phase10-controlled-canary-test.js"
      - "scripts/drx-phase10-consumer-audit.js"
      - "scripts/drx-phase10-legacy-retirement-preflight.js"
      - "tests/drx-phase10-legacy-retirement-preflight-test.js"
      - "tests/drx-phase10-cutover-control-test.js"
      - "lib/dose-v3-runtime-gate.js"
      - "lib/dose-product-fast-path-handler.js"
      - "api/dosage.js"
      - ".github/workflows/drx-phase10-cutover-gate.yml"

permissions:
  contents: read

jobs:
  phase10:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MEDINDEX_SUPABASE_URL: https://ftuchtmolddhhsdcwnqe.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Phase 10A static cutover contract
        run: node tests/drx-phase10-cutover-control-test.js
      - name: Phase 10B controlled traffic plumbing
        run: node tests/drx-phase10-controlled-traffic-test.js
      - name: Phase 10C golden and parity evidence
        run: node tests/drx-phase10-golden-parity-evidence-test.js
      - name: Phase 10D control-plane reconciliation
        run: node tests/drx-phase10-control-plane-reconciliation-test.js
      - name: Phase 10E security and legacy-write evidence
        run: node tests/drx-phase10-security-write-evidence-test.js
      - name: Phase 10F rollback drill evidence
        run: node tests/drx-phase10-rollback-drill-test.js
      - name: Phase 10G stable traffic bucket
        run: node tests/drx-phase10-stable-traffic-bucket-test.js
      - name: Phase 10H controlled soak start
        run: node tests/drx-phase10-controlled-soak-start-test.js
      - name: Phase 10 legacy runtime consumer audit
        run: node scripts/drx-phase10-consumer-audit.js
      - name: Phase 10L legacy retirement preflight contract
        run: node tests/drx-phase10-legacy-retirement-preflight-test.js
      - name: P0 database integrity
        run: node tests/p0-database-integrity-test.js
      - name: Public security contract
        run: node tests/phase1-public-security-contract-test.js
      - name: API security deep audit
        run: node tests/api-security-deep-audit-test.js
      - name: Golden clinical cases
        run: node tests/drx-dose-golden-cases-test.js
      - name: Phase 10 controlled canary contract
        run: node tests/drx-phase10-controlled-canary-test.js
      - name: Phase 10 pediatric V3 calculator contract
        run: node tests/drx-phase10-pediatric-v3-calculator-test.js
      - name: Phase 10J pediatric V3 metadata RPC security
        run: node tests/drx-phase10-pediatric-v3-metadata-rpc-test.js
      - name: Phase 10K current restore test evidence
        run: node tests/drx-phase10k-restore-test-evidence-test.js
      - name: Live Phase 10 controlled canary
        run: node scripts/drx-phase10-controlled-canary.js
      - name: Live Phase 10 pediatric V3 calculator
        run: node scripts/drx-phase10-pediatric-v3-live.js
      - name: Live Phase 10 legacy retirement preflight
        run: node scripts/drx-phase10-legacy-retirement-preflight.js
      - name: Live Phase 10 status
        run: node scripts/drx-phase10-status.js
      - name: Upload Phase 10A evidence
        uses: actions/upload-artifact@v4
        with:
          name: drx-phase10a-evidence
          path: |
            drx-phase10-status-evidence.json
            drx-phase10-consumer-audit.json
            drx-phase10-legacy-retirement-preflight.json
            drx-phase10-controlled-canary-evidence.json
            drx-phase10-pediatric-v3-live-evidence.json
          if-no-files-found: error
          retention-days: 30
