name: One-shot registry search repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-registry-search-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply global registry search repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_literal(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected literal not found in {path}: {old[:80]}')
              p.write_text(text.replace(old, new, 1))

          def replace_regex(path, pattern, replacement, flags=0):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'Expected pattern not found in {path}: {pattern[:100]}')
              p.write_text(updated)

          # UI: a failed query must never leave rows from the previous drug visible.
          replace_regex(
              'registry-v2.js',
              r"  function renderError\(message\) \{.*?\n  \}(?=\n\n  (?:async )?function )",
              """  function renderError(message) {
            // Fail closed visually as well as at the API layer: never mix an error
            // for the new query with rows left over from the previous query.
            state.rows = [];
            state.total = 0;
            state.totalPages = 1;
            state.dosageByRegistry.clear();
            el.registryRows.innerHTML = '';
            el.registryList.innerHTML = '';
            el.tableScroll.hidden = true;
            el.registryList.hidden = true;
            el.emptyState.hidden = false;
            el.emptyState.querySelector('h2').textContent = 'Regjistri nuk u ngarkua';
            el.emptyState.querySelector('p').textContent = message;
            el.resultSummary.textContent = 'Gabim gjatë ngarkimit';
            el.requestTiming.textContent = '';
            el.paginationSummary.textContent = 'Asnjë rezultat';
            el.pageIndicator.textContent = '1 / 1';
            el.prevPageButton.disabled = true;
            el.nextPageButton.disabled = true;
          }""",
              re.S,
          )

          # Ask every browser already controlling the registry to check its worker
          # immediately instead of waiting for the normal service-worker cadence.
          replace_regex(
              'registry-v2.js',
              r"  async function init\(\) \{",
              """  async function refreshRegistryServiceWorker() {
            if (!('serviceWorker' in navigator)) return;
            try {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(registration => registration.update().catch(() => null)));
            } catch (error) {
              console.debug('Registry service worker refresh skipped:', error);
            }
          }

          async function init() {
            void refreshRegistryServiceWorker();""",
          )

          # Build-pinned URLs are intentionally treated as non-substitutable by the
          # resilient worker; an older registry JS/CSS can no longer be served here.
          replace_regex(
              'index.html',
              r'/registry-v2\.css\?(?:v|build)=[^"\']+',
              '/registry-v2.css?build=registry-search-20260914-v1',
          )
          replace_regex(
              'index.html',
              r'/registry-v2\.js\?(?:v|build)=[^"\']+',
              '/registry-v2.js?build=registry-search-20260914-v1',
          )

          # Current resilient worker: new cache namespace + versioned query keys.
          replace_regex(
              'sw-resilient.js',
              r"const VERSION = '[^']+';",
              "const VERSION = 'low-bandwidth-v4-search-freshness';",
          )
          replace_regex(
              'sw-resilient.js',
              r"function queryKey\(url\) \{.*?\n\}",
              """function queryKey(url) {
            const normalized = new URL(url.href);
            normalized.hash = '';
            normalized.searchParams.set('__drx_worker', VERSION);
            normalized.searchParams.sort();
            return requestFor(normalized.href, { headers:{ Accept:'application/json' } });
          }""",
              re.S,
          )
          replace_regex(
              'sw-resilient.js',
              r"async function queryDataResponse\(event, url\) \{.*?\n\}(?=\n\nfunction parseRange)",
              """async function queryDataResponse(event, url) {
            const request = event.request;
            const key = queryKey(url);
            const cache = await caches.open(PRIVATE_CACHE);

            // Clinical search is network-first while online. A cached response is
            // only an offline fallback, never a substitute for an HTTP/auth error.
            if (networkProfile.online) {
              const response = await refreshPrivate(request, key);
              if (response) {
                if (response.ok) await trimCache(cache, MAX_QUERY_RESPONSES);
                return response;
              }
            }

            const cached = await cache.match(key);
            if (cached) return cloneWithHeader(cached, 'query-offline-hit');
            return new Response(JSON.stringify({ error:'Kërkimi online nuk është i disponueshëm.', results:[], rows:[], offline:true }), {
              status:503,
              headers:{ 'Content-Type':'application/json; charset=utf-8', 'X-MedIndex-Offline':'1' },
            });
          }""",
              re.S,
          )

          # Legacy worker receives the same semantics for users whose browser still
          # has /sw.js registered from an older release.
          replace_regex(
              'sw.js',
              r"const VERSION = '[^']+';",
              "const VERSION = 'workspace-coherence-v8-search-freshness';",
          )
          replace_regex(
              'sw.js',
              r"const CACHE_EPOCH = '[^']+';",
              "const CACHE_EPOCH = '20260914-registry-search-v1';",
          )
          replace_regex(
              'sw.js',
              r"function queryKey\(url\) \{.*?\n\}",
              """function queryKey(url) {
            const normalized = new URL(url.href);
            normalized.hash = '';
            normalized.searchParams.set('__drx_worker', VERSION);
            normalized.searchParams.sort();
            return requestFor(normalized.href, { headers:{ Accept:'application/json' } });
          }""",
              re.S,
          )
          replace_regex(
              'sw.js',
              r"async function queryDataResponse\(event, url\) \{.*?\n\}(?=\n\nfunction parseRange)",
              """async function queryDataResponse(event, url) {
            const request = event.request;
            const key = queryKey(url);
            const cache = await caches.open(PRIVATE_CACHE);
            try {
              const response = await timeoutFetch(new Request(request, { cache:'no-store' }));
              if ([401, 403].includes(response.status)) {
                await broadcast({ type:'MEDINDEX_AUTH_INVALID' });
                return response;
              }
              if (response.ok) return putIfCacheable(PRIVATE_CACHE, key, response, { key, limit:MAX_QUERY_RESPONSES });
              return response;
            } catch {
              const cached = await cache.match(key);
              if (cached) return cloneWithHeader(cached, 'X-MedIndex-Cache', 'query-offline-hit');
              return new Response(JSON.stringify({ error:'Kërkimi online nuk është i disponueshëm.', results:[], rows:[], offline:true }), {
                status:503,
                headers:{ 'Content-Type':'application/json; charset=utf-8', 'X-MedIndex-Offline':'1' },
              });
            }
          }""",
              re.S,
          )

          replace_regex(
              'offline-runtime.js',
              r"const RESILIENCE_VERSION = '[^']+';",
              "const RESILIENCE_VERSION = 'low-bandwidth-v4-search-freshness';",
          )
          PY

      - name: Validate changed runtimes
        run: |
          node --check registry-v2.js
          node --check sw-resilient.js
          node --check sw.js
          node --check offline-runtime.js
          node tests/phase3-ranked-registry-search-test.js
          node tests/registry-page-api-test.js
          node tests/vercel-hobby-function-budget-test.js

      - name: Commit repair directly to main
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-registry-search-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry-v2.js index.html sw-resilient.js sw.js offline-runtime.js .github/workflows/one-shot-registry-search-repair.yml
          git commit -m "fix(registry): make search fresh and fail cleanly for all drugs"
          git push origin HEAD:main
