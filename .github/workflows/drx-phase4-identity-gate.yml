name: DRx Phase 4 identity gate\n\non:\n  workflow_dispatch:\n  push:\n    branches:\n      - main\n    paths:\n      - "supabase/migrations/20260830154341_drx_phase4_identity_namespace_core.sql"\n      - "supabase/migrations/20260830154611_drx_phase4_preferred_identity_term_hardening.sql"\n      - "supabase/migrations/20260830155021_drx_phase4_component_identity_closure.sql"\n      - "supabase/migrations/20260830155203_drx_phase4_component_provenance_hardening.sql"\n      - "tests/drx-phase4-identity-namespace-test.js"\n      - "scripts/drx-phase4-status.js"\n      - "docs/DRX-PHASE4-ROLLBACK.md"\n      - ".github/workflows/drx-phase4-identity-gate.yml"\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: drx-phase4-identity-gate\n  cancel-in-progress: false\n\njobs:\n  gate:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    env:\n      MEDINDEX_SUPABASE_URL: https://ftuchtmolddhhsdcwnqe.supabase.co\n      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-node@v4\n        with:\n          node-version: "24"\n\n      - name: Static Phase 4 contract\n        run: node tests/drx-phase4-identity-namespace-test.js\n\n      - name: Live Phase 4 gate\n        run: node scripts/drx-phase4-status.js\n\n      - name: Upload Phase 4 evidence\n        uses: actions/upload-artifact@v4\n        with:\n          name: drx-phase4-status-evidence\n          path: drx-phase4-status-evidence.json\n          if-no-files-found: error\n          retention-days: 30\n