name: DRx Phase 4 identity gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260830154341_drx_phase4_identity_namespace_core.sql"
      - "supabase/migrations/20260830154611_drx_phase4_preferred_identity_term_hardening.sql"
      - "supabase/migrations/20260830155021_drx_phase4_component_identity_closure.sql"
      - "supabase/migrations/20260830155203_drx_phase4_component_provenance_hardening.sql"
      - "tests/drx-phase4-identity-namespace-test.js"
      - "scripts/drx-phase4-status.js"
      - "docs/DRX-PHASE4-ROLLBACK.md"
      - ".github/workflows/drx-phase4-identity-gate.yml"

permissions:
  contents: read

concurrency:
  group: drx-phase4-identity-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MEDINDEX_SUPABASE_URL: https://ftuchtmolddhhsdcwnqe.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Static Phase 4 contract
        run: node tests/drx-phase4-identity-namespace-test.js

      - name: Live Phase 4 gate
        run: node scripts/drx-phase4-status.js

      - name: Upload Phase 4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: drx-phase4-status-evidence
          path: drx-phase4-status-evidence.json
          if-no-files-found: error
          retention-days: 30
