name: Apply MedIndex pricing and neutral brand section

on:
  push:
    branches:
      - ui/price-brand-neutral-20260822
    paths:
      - .github/workflows/medindex-price-neutral.yml

permissions:
  contents: write

jobs:
  update-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/price-brand-neutral-20260822
      - name: Update landing page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('login-v2.html')
          text = path.read_text(encoding='utf-8')

          old_price = 'aria-label="19 euro e 99 cent në muaj">\n            <strong>19.99&nbsp;€</strong><span>/ muaj</span>'
          new_price = 'aria-label="5 euro e 99 cent në muaj">\n            <strong>5.99&nbsp;€</strong><span>/ muaj</span>'
          if old_price not in text:
              raise SystemExit('Expected 19.99 pricing block not found')
          text = text.replace(old_price, new_price, 1)

          start_marker = '    <!-- ── THEMELUESJA'
          end_marker = '    <!-- ── PLANI'
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit('Founder/plan section markers not found')

          neutral = '''    <!-- ── PSE MEDINDEX ───────────────────────────────────────────────── -->
    <section class="lv-section" id="themeluesja">
      <div class="lv-shell">
        <div class="lv-reveal" style="position:relative;overflow:hidden;border:1px solid #dfe6f2;border-radius:28px;background:linear-gradient(135deg,#f7faff 0%,#ffffff 58%,#f5fbfb 100%);box-shadow:0 18px 50px rgba(15,31,61,.07);padding:clamp(34px,5vw,64px);">
          <div aria-hidden="true" style="position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,#3d6fe0 0%,#2450b8 48%,#138789 100%);"></div>
          <p class="lv-kicker">Pse ekziston MedIndex</p>
          <h2 style="max-width:820px;margin:10px 0 18px;color:#0b1220;font-size:clamp(34px,4.5vw,60px);line-height:1.02;letter-spacing:-.045em;">Më pak kërkim. Më shumë qartësi klinike.</h2>
          <p style="max-width:920px;margin:0;color:#647089;font-size:clamp(17px,1.55vw,21px);line-height:1.7;">Informacioni për barnat, dozat, klasifikimet dhe protokollet shpesh gjendet në burime të ndara. MedIndex i organizon këto mjete në një hapësirë të vetme pune, që informacioni të gjendet më shpejt dhe të përdoret më qartë në praktikë.</p>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:34px;">
            <article style="min-width:0;border:1px solid #e4eaf3;border-radius:20px;background:rgba(255,255,255,.84);padding:22px;box-shadow:0 8px 24px rgba(15,31,61,.04);">
              <span style="display:inline-flex;margin-bottom:14px;color:#3561d8;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;">01 · Strukturë</span>
              <h3 style="margin:0 0 9px;color:#0b1220;font-size:20px;letter-spacing:-.02em;">Një rrjedhë e vetme</h3>
              <p style="margin:0;color:#6d7890;line-height:1.65;">Barnat, ATC, ICD-10, analizat, dozologjia, protokollet dhe recetat organizohen në të njëjtën hapësirë.</p>
            </article>
            <article style="min-width:0;border:1px solid #e4eaf3;border-radius:20px;background:rgba(255,255,255,.84);padding:22px;box-shadow:0 8px 24px rgba(15,31,61,.04);">
              <span style="display:inline-flex;margin-bottom:14px;color:#3561d8;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;">02 · Shpejtësi</span>
              <h3 style="margin:0 0 9px;color:#0b1220;font-size:20px;letter-spacing:-.02em;">Kërkim i drejtpërdrejtë</h3>
              <p style="margin:0;color:#6d7890;line-height:1.65;">Më pak kalim mes burimeve dhe më shumë fokus te informacioni klinik që duhet në moment.</p>
            </article>
            <article style="min-width:0;border:1px solid #e4eaf3;border-radius:20px;background:rgba(255,255,255,.84);padding:22px;box-shadow:0 8px 24px rgba(15,31,61,.04);">
              <span style="display:inline-flex;margin-bottom:14px;color:#138789;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;">03 · Privatësi</span>
              <h3 style="margin:0 0 9px;color:#0b1220;font-size:20px;letter-spacing:-.02em;">Qasje private</h3>
              <p style="margin:0;color:#6d7890;line-height:1.65;">Hyrja kontrollohet përmes llogarisë së aprovuar dhe një sesioni të mbrojtur në server.</p>
            </article>
          </div>
        </div>
      </div>
    </section>'''

          text = text[:start] + neutral + '\n\n' + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit landing update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add login-v2.html
          git commit -m "Set Clinical+ to 5.99 and remove founder card"
          git push origin HEAD:ui/price-brand-neutral-20260822
