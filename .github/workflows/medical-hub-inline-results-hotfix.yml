name: Medical Hub inline results hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/medical-hub-inline-results-hotfix.yml

permissions:
  contents: write

jobs:
  inline-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Move results below footer
        run: python -c "import base64;exec(base64.b64decode(''))"

      - name: Commit
        run: |
          if git diff --quiet -- medical-hub.html; then
            echo "No change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medical-hub.html
          git commit -m "fix: show Medical Hub search results below as list"
          git push origin HEAD:main
