name: Refine Clinical plan card

on:
  push:
    paths:
      - .github/workflows/refine-clinical-plan-card.yml
      - scripts/refine-clinical-plan-card.py

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Implement the refined Clinical card
        run: python scripts/refine-clinical-plan-card.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          node --check theme-preload.js
          grep -q 'data-mi-login-version="20260805-clinical-plan-card-v2"' login.html
          grep -q 'class="plan-kicker"' login.html
          grep -q 'class="plan-kicker-icon"' login.html
          grep -q 'MedIndex Clinical+ card v2' landing-signature.css
          grep -q "landing-signature.css?v=20260805-2" theme-preload.js
          pnpm test

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refine-clinical-plan-card.yml scripts/refine-clinical-plan-card.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine the MedIndex Clinical+ pricing card'
          git push origin HEAD:main
