name: DRx Phase 1 Backup Restore Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/drx-phase1-backup-restore.yml"
      - "data/drx-phase1-baseline-v1.json"
      - "tests/drx-phase1-backup-workflow-test.js"

permissions:
  contents: read

concurrency:
  group: drx-phase1-backup-restore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_POSTGRES_VERSION: "17.6.1.155"
      SUPABASE_PROJECT_REF: "ftuchtmolddhhsdcwnqe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve backup credential safely
        id: credential
        shell: bash
        env:
          ALL_REPO_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          secrets = json.loads(os.environ.get("ALL_REPO_SECRETS") or "{}")
          project_ref = os.environ["SUPABASE_PROJECT_REF"]

          resolved_url = None
          resolved_name = None
          resolved_kind = None

          # Best case: any repository secret already contains a PostgreSQL URL.
          for name, value in secrets.items():
              if isinstance(value, str) and value.startswith(("postgres://", "postgresql://")):
                  resolved_url = value
                  resolved_name = name
                  resolved_kind = "postgres_url"
                  break

          # Fallback: only accept a raw password when the secret name clearly
          # identifies it as a database/Postgres/Supabase password. Never treat
          # API secret/service-role keys as database passwords.
          if not resolved_url:
              for name, value in secrets.items():
                  upper = name.upper()
                  password_named = "PASSWORD" in upper
                  db_named = (
                      "SUPABASE" in upper
                      or "POSTGRES" in upper
                      or "DATABASE" in upper
                      or upper.startswith("DB_")
                      or upper.endswith("_DB")
                  )
                  forbidden = (
                      "SERVICE_ROLE" in upper
                      or "SECRET_KEY" in upper
                      or "PUBLISHABLE" in upper
                      or "ANON" in upper
                      or "API_KEY" in upper
                  )
                  if value and password_named and db_named and not forbidden:
                      encoded = quote(str(value), safe="")
                      resolved_url = (
                          f"postgresql://postgres:{encoded}@db.{project_ref}.supabase.co:5432/"
                          "postgres?sslmode=require"
                      )
                      resolved_name = name
                      resolved_kind = "database_password"
                      break

          output = Path(os.environ["GITHUB_OUTPUT"])
          if resolved_url:
              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as fh:
                  fh.write("SUPABASE_DB_URL<<DRXEOF\n")
                  fh.write(resolved_url + "\n")
                  fh.write("DRXEOF\n")
              print(f"::add-mask::{resolved_url}")
              with output.open("a", encoding="utf-8") as fh:
                  fh.write("available=true\n")
                  fh.write(f"kind={resolved_kind}\n")
              print("::notice::A compatible database credential was resolved from existing repository secrets.")
          else:
              with output.open("a", encoding="utf-8") as fh:
                  fh.write("available=false\n")
                  fh.write("kind=none\n")
              candidate_names = sorted(
                  name for name in secrets
                  if any(token in name.upper() for token in ("SUPABASE","POSTGRES","DATABASE","DB"))
              )
              print("::notice::No compatible PostgreSQL URL/database-password secret was found.")
              if candidate_names:
                  print("::notice::Related secret names present: " + ", ".join(candidate_names))
          PY

      - name: Write blocked evidence
        if: steps.credential.outputs.available != 'true'
        shell: bash
        run: |
          cat > drx-phase1-backup-restore-evidence.json <<'JSON'
          {
            "schemaVersion": "drx-phase1-backup-restore-evidence-v1",
            "status": "BLOCKED_MISSING_DATABASE_CREDENTIAL_ALIAS",
            "backupCreated": false,
            "restoreExecuted": false,
            "restoreVerified": false,
            "publicationAllowed": false
          }
          JSON

      - name: Setup Supabase CLI
        if: steps.credential.outputs.available == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Create logical backup set
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/drx-phase1-backup"
          mkdir -p "$BACKUP_DIR"

          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/roles.sql" --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/data.sql" --use-copy --data-only \
            -x "storage.buckets_vectors" -x "storage.vector_indexes"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/history_schema.sql" --schema supabase_migrations
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/history_data.sql" --use-copy --data-only --schema supabase_migrations

          test -s "$BACKUP_DIR/roles.sql"
          test -s "$BACKUP_DIR/schema.sql"
          test -s "$BACKUP_DIR/data.sql"
          test -s "$BACKUP_DIR/history_schema.sql"
          test -s "$BACKUP_DIR/history_data.sql"

          sha256sum "$BACKUP_DIR"/*.sql > "$BACKUP_DIR/sha256.txt"

      - name: Restore into disposable local Supabase
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/drx-phase1-backup"
          RESTORE_DIR="$RUNNER_TEMP/drx-phase1-restore"
          mkdir -p "$RESTORE_DIR"
          cd "$RESTORE_DIR"

          supabase init
          mkdir -p supabase/.temp
          printf '%s\n' "$SOURCE_POSTGRES_VERSION" > supabase/.temp/postgres-version
          supabase start

          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'

          # Platform roles are provisioned by the local Supabase stack. The
          # role dump remains part of the backup set and is hashed, while
          # application schema/data are replayed into this isolated target.
          psql "$DB_URL" --set ON_ERROR_STOP=1 --file "$BACKUP_DIR/schema.sql"
          psql "$DB_URL" --set ON_ERROR_STOP=1 \
            --command 'SET session_replication_role = replica' \
            --file "$BACKUP_DIR/data.sql"

          psql "$DB_URL" --set ON_ERROR_STOP=1 --tuples-only --no-align <<'SQL' > "$RUNNER_TEMP/drx-restore-counts.txt"
          select 'drugs=' || count(*) from public.drugs;
          select 'dosage_regimens=' || count(*) from public.dosage_regimens;
          select 'stage_product_registry=' || count(*) from drx_stage.product_registry_v1;
          select 'stage_variant_master=' || count(*) from drx_stage.variant_master_v1;
          select 'stage_substance_master=' || count(*) from drx_stage.substance_master_v1;
          select 'source_snapshots=' || count(*) from public.dose_source_snapshots_v3;
          select 'source_sections=' || count(*) from public.dose_source_sections_v3;
          select 'v3_products=' || count(*) from public.dose_products_v3;
          select 'v3_rules=' || count(*) from public.dose_rules_v3;
          select 'v3_bindings=' || count(*) from public.dose_rule_products_v3;
          select 'published_rules=' || count(*) from public.dose_rules_v3 where editorial_status='published';
          SQL

          grep -qx 'drugs=4015' "$RUNNER_TEMP/drx-restore-counts.txt"
          grep -qx 'dosage_regimens=8104' "$RUNNER_TEMP/drx-restore-counts.txt"
          grep -qx 'stage_product_registry=4015' "$RUNNER_TEMP/drx-restore-counts.txt"
          grep -qx 'stage_variant_master=2674' "$RUNNER_TEMP/drx-restore-counts.txt"
          grep -qx 'stage_substance_master=1351' "$RUNNER_TEMP/drx-restore-counts.txt"
          grep -qx 'source_snapshots=100' "$RUNNER_TEMP/drx-restore-counts.txt"
          grep -qx 'source_sections=575' "$RUNNER_TEMP/drx-restore-counts.txt"
          grep -qx 'v3_products=0' "$RUNNER_TEMP/drx-restore-counts.txt"
          grep -qx 'v3_rules=0' "$RUNNER_TEMP/drx-restore-counts.txt"
          grep -qx 'v3_bindings=0' "$RUNNER_TEMP/drx-restore-counts.txt"
          grep -qx 'published_rules=0' "$RUNNER_TEMP/drx-restore-counts.txt"

          supabase stop --no-backup

      - name: Write successful evidence
        if: steps.credential.outputs.available == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/drx-phase1-backup"
          python3 - <<'PY'
          import json
          from pathlib import Path
          hashes={}
          for line in Path(__import__('os').environ['RUNNER_TEMP'] + '/drx-phase1-backup/sha256.txt').read_text().splitlines():
              digest, filename=line.split(None,1)
              hashes[Path(filename).name]=digest
          counts={}
          for line in Path(__import__('os').environ['RUNNER_TEMP'] + '/drx-restore-counts.txt').read_text().splitlines():
              k,v=line.split('=',1)
              counts[k]=int(v)
          evidence={
              "schemaVersion":"drx-phase1-backup-restore-evidence-v1",
              "status":"PASS",
              "credentialAliasResolved":True,
              "backupCreated":True,
              "backupSha256":hashes,
              "restoreExecuted":True,
              "restoreVerified":True,
              "restoredCounts":counts,
              "backupRetention":"runner_ephemeral_only_no_database_payload_uploaded",
              "publicationAllowed":False
          }
          Path('drx-phase1-backup-restore-evidence.json').write_text(json.dumps(evidence,indent=2)+"\n")
          PY

      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drx-phase1-backup-restore-evidence
          path: drx-phase1-backup-restore-evidence.json
          if-no-files-found: error
          retention-days: 30
