name: DRx Master Official Source Enrichment

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/enrich-drx-master-official-sources.js'
      - 'data/drx-master-enrichment-input-*.json'
      - '.github/workflows/drx-master-official-enrichment.yml'

concurrency:
  group: drx-master-official-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate syntax
        run: node --check scripts/enrich-drx-master-official-sources.js

      - name: Enrich official sources
        run: node scripts/enrich-drx-master-official-sources.js

      - name: Validate fail-closed enrichment
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const dir='data/drx-master-official-enrichment';
          const files=fs.readdirSync(dir).filter(x=>/^chunk-\d+\.json$/.test(x)).sort();
          const rows=files.flatMap(f=>JSON.parse(fs.readFileSync(path.join(dir,f),'utf8')).rows||[]);
          if(!rows.length) throw new Error('no enrichment rows');
          const exact=rows.filter(r=>r.status==='EXACT_OFFICIAL_SOURCE');
          const badExact=exact.filter(r=>!r.sourceUrl||!r.section41Hash||!r.section42Hash||r.exactEligible!==true);
          if(badExact.length) throw new Error('invalid exact official rows: '+badExact.length);
          const textReady=rows.filter(r=>r.status==='SOURCE_TEXT_READY');
          const badText=textReady.filter(r=>!r.section41Text||!r.section42Text||r.exactEligible!==false);
          if(badText.length) throw new Error('source text rows escaped normalization gate: '+badText.length);
          console.log(JSON.stringify({rows:rows.length,exactOfficial:exact.length,sourceTextReady:textReady.length},null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: drx-master-official-enrichment
          path: data/drx-master-official-enrichment
          retention-days: 30

  materialize-summary:
    needs: enrich
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: drx-master-official-enrichment
          path: data/drx-master-official-enrichment
      - name: Commit summary only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drx-master-official-enrichment/summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(drx): materialize official enrichment summary"
          git push origin HEAD:main
