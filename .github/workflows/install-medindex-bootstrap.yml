name: Install MedIndex bootstrap

on:
  push:
    paths:
      - .github/workflows/install-medindex-bootstrap.yml

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add secure Google bootstrap
        shell: python
        run: |
          from pathlib import Path

          path = Path('api/drive-sync.js')
          text = path.read_text(encoding='utf-8')

          marker = "const DOSAGE_SHEETS = new Set(['KARTELA_BARNAVE', 'DOZA_TE_RRITUR', 'DOZA_PEDIATRIKE']);"
          owner = "const GOOGLE_SYNC_OWNER_EMAIL = 'diellzarabushaj@gmail.com';"
          if owner not in text:
              text = text.replace(marker, marker + "\n" + owner, 1)

          helper = r'''

          async function verifiedGoogleOwner(req, payload = parseBody(req)) {
            const authorization = clean(req.headers?.authorization);
            const match = authorization.match(/^Bearer\s+(.+)$/i);
            if (!match) return '';
            const token = clean(match[1]);
            if (token.length < 40 || token.length > 4096) return '';

            const spreadsheetId = clean(payload.spreadsheetId);
            if (spreadsheetId !== CURRENT_DOSAGE_SPREADSHEET_ID) return '';

            const tokenInfoResponse = await fetch(
              `https://oauth2.googleapis.com/tokeninfo?access_token=${encodeURIComponent(token)}`,
              { headers:{ Accept:'application/json' } },
            );
            if (!tokenInfoResponse.ok) return '';
            const tokenInfo = await tokenInfoResponse.json().catch(() => ({}));
            const email = clean(tokenInfo.email).toLowerCase();
            if (email !== GOOGLE_SYNC_OWNER_EMAIL) return '';

            const sheetResponse = await fetch(
              `https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(spreadsheetId)}`
                + '?fields=spreadsheetId%2Csheets.properties.title',
              { headers:{ Authorization:`Bearer ${token}`, Accept:'application/json' } },
            );
            if (!sheetResponse.ok) return '';
            const metadata = await sheetResponse.json().catch(() => ({}));
            const titles = Array.isArray(metadata.sheets)
              ? metadata.sheets.map(item => clean(item?.properties?.title))
              : [];
            if (metadata.spreadsheetId !== spreadsheetId) return '';
            if (![...DOSAGE_SHEETS].every(title => titles.includes(title))) return '';
            return email;
          }

          async function bootstrapSecret(req, res, payload) {
            const email = await verifiedGoogleOwner(req, payload);
            res.setHeader('Cache-Control', 'no-store');
            res.setHeader('X-Content-Type-Options', 'nosniff');
            if (!email) return res.status(401).json({ ok:false, error:'Autorizimi Google nuk u verifikua.' });

            const secret = crypto.randomBytes(36).toString('base64url');
            const secretHash = crypto.createHash('sha256').update(secret, 'utf8').digest('hex');
            const now = new Date().toISOString();
            await neonRequest(
              `drive_sync_sources?spreadsheet_id=eq.${encodeURIComponent(CURRENT_DOSAGE_SPREADSHEET_ID)}`
                + `&sheet_name=in.(${[...DOSAGE_SHEETS].join(',')})`,
              {
                method:'PATCH',
                body:{ auth_secret_hash:secretHash, enabled:true, last_status:'pending', last_error:null, updated_at:now },
                prefer:'return=minimal',
              },
            );
            return res.status(200).json({ ok:true, secret, owner:email, expires:'stored_by_apps_script_only' });
          }
          '''
          if 'async function verifiedGoogleOwner' not in text:
              text = text.replace('\nasync function verifiedSecret', helper + '\nasync function verifiedSecret', 1)

          old = '''    const payload = parseBody(req);
              const verification = await verifiedSecret(req, payload);'''
          new = '''    const payload = parseBody(req);
              if (clean(payload.action) === 'bootstrap_secret') return bootstrapSecret(req, res, payload);
              const verification = await verifiedSecret(req, payload);'''
          if old not in text:
              raise SystemExit('Handler authorization anchor not found')
          text = text.replace(old, new, 1)

          internal = '''  verifiedSecret,
            editorValues,'''
          if 'verifiedGoogleOwner,' not in text:
              text = text.replace(internal, '''  verifiedSecret,
            verifiedGoogleOwner,
            bootstrapSecret,
            editorValues,''', 1)

          path.write_text(text, encoding='utf-8')

          bootstrap = Path('google-apps-script/medindex-secret-bootstrap.gs')
          bootstrap.write_text(r'''// MedIndex one-click bootstrap.
          // Add this as a second Apps Script file, then run setupMedIndexBootstrap once.
          'use strict';

          function setupMedIndexBootstrap() {
            const spreadsheet = SpreadsheetApp.getActiveSpreadsheet();
            if (!spreadsheet || spreadsheet.getId() !== '1T7XsfkXLQfEomFL4DmXoA8PheiR6s3Qmu36hTqklOMo') {
              throw new Error('Hape Apps Script nga spreadsheet-i MedIndex dhe provo përsëri.');
            }

            const response = UrlFetchApp.fetch('https://barnat-six.vercel.app/api/drive-sync', {
              method:'post',
              contentType:'application/json; charset=utf-8',
              headers:{ Authorization:`Bearer ${ScriptApp.getOAuthToken()}` },
              payload:JSON.stringify({
                action:'bootstrap_secret',
                spreadsheetId:spreadsheet.getId(),
                sheetName:'KARTELA_BARNAVE',
              }),
              muteHttpExceptions:true,
              followRedirects:true,
            });
            const status = response.getResponseCode();
            const body = JSON.parse(response.getContentText() || '{}');
            if (status < 200 || status >= 300 || !body.ok || !body.secret) {
              throw new Error(body.error || `Aktivizimi dështoi (${status}).`);
            }

            PropertiesService.getScriptProperties().setProperty('MEDINDEX_DRIVE_SYNC_SECRET', body.secret);
            setupMedIndexPerfectSync();
          }
          ''', encoding='utf-8')

      - name: Verify syntax
        shell: bash
        run: |
          node --check api/drive-sync.js
          cp google-apps-script/medindex-secret-bootstrap.gs /tmp/medindex-secret-bootstrap.js
          node --check /tmp/medindex-secret-bootstrap.js

      - name: Commit bootstrap
        shell: bash
        run: |
          rm -f .github/workflows/install-medindex-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/drive-sync.js google-apps-script/medindex-secret-bootstrap.gs .github/workflows/install-medindex-bootstrap.yml
          git commit -m 'Add owner-authorized one-click Sheet sync bootstrap'
          git push origin HEAD:main
