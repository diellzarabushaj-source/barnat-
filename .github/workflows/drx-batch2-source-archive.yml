name: DRx Batch 2 Source Archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-drx-batch2-extraction-index.js'
      - 'scripts/verify-drx-batch2-archive.js'
      - 'lib/dose-source-archive.js'
      - 'lib/smpc-parser.js'
      - 'data/drx-dose-batch2-v1.json'
      - 'tests/drx-batch2-archive-verifier-test.js'
      - '.github/workflows/drx-batch2-source-archive.yml'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRX_ARCHIVE_DIR: artifacts/drx-batch2-raw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify archive contracts
        run: |
          node tests/drx-batch2-archive-verifier-test.js
          node tests/drx-batch2-archive-workflow-test.js

      - name: Archive and parse Batch 2 sources
        run: |
          mkdir -p "$DRX_ARCHIVE_DIR"
          node scripts/build-drx-batch2-extraction-index.js

      - name: Verify hash-backed archive
        run: |
          node scripts/verify-drx-batch2-archive.js \
            --index=data/drx-batch2-extraction-index-v1.json \
            --archive="$DRX_ARCHIVE_DIR" \
            --expected=25

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: drx-batch2-source-archive
          path: |
            artifacts/drx-batch2-raw/**
            data/drx-batch2-extraction-index-v1.json
          if-no-files-found: error
          retention-days: 90
