name: DRx Batch 2 Source Archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-drx-batch2-extraction-index.js'
      - 'scripts/build-drx-batch2-archive-attestation.js'
      - 'scripts/verify-drx-batch2-archive.js'
      - 'lib/dose-source-archive.js'
      - 'lib/smpc-parser.js'
      - 'data/drx-dose-batch2-v1.json'
      - 'tests/drx-batch2-archive-verifier-test.js'
      - '.github/workflows/drx-batch2-source-archive.yml'

# Read-only by default. Only the attest job widens this, and it never touches
# the network or parses fetched documents.
permissions:
  contents: read

concurrency:
  group: drx-batch2-source-archive
  cancel-in-progress: false

jobs:
  # Fetches and parses untrusted external regulatory documents. It must never
  # hold a token that can write to the repository: if the parser were exploited
  # by a malicious document, a writable token would let it push code.
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DRX_ARCHIVE_DIR: artifacts/drx-batch2-raw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify archive contracts
        run: |
          node tests/drx-batch2-archive-verifier-test.js
          node tests/drx-batch2-archive-workflow-test.js

      - name: Archive and parse Batch 2 sources
        run: |
          mkdir -p "$DRX_ARCHIVE_DIR"
          node scripts/build-drx-batch2-extraction-index.js

      - name: Verify hash-backed archive
        run: |
          node scripts/verify-drx-batch2-archive.js \
            --index=data/drx-batch2-extraction-index-v1.json \
            --archive="$DRX_ARCHIVE_DIR" \
            --expected=25

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: drx-batch2-source-archive
          path: |
            artifacts/drx-batch2-raw/**
            data/drx-batch2-extraction-index-v1.json
          if-no-files-found: error
          retention-days: 90

  # The artifact above expires in 90 days and no repository gate can read it.
  # This job distils that run into a committable attestation: source identity,
  # raw sha256 and section 4.1/4.2 sha256 only, never document text.
  #
  # It is deliberately separate from archive so that write access is held only
  # by a job that makes no network requests and parses no fetched documents -
  # it reads one index file and validates every field before writing.
  attest:
    needs: archive
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download source archive
        uses: actions/download-artifact@v4
        with:
          name: drx-batch2-source-archive

      - name: Build archive attestation
        run: node scripts/build-drx-batch2-archive-attestation.js

      - name: Verify attestation gate
        run: node tests/drx-batch2-archive-attestation-test.js

      - name: Commit attestation
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/drx-batch2-archive-attestation-v1.json data/drx-dosierung-master-plan-status.json
          if git diff --cached --quiet; then
            echo 'Attestation unchanged; nothing to commit.'
            exit 0
          fi
          git commit -m "chore(drx): materialize Batch 2 archive attestation from run ${GITHUB_RUN_ID}"
          # The attestation is not in this workflow's trigger paths, so this
          # push cannot retrigger the archive run.
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt ${attempt} failed; retrying"
            sleep $((2 ** attempt))
          done
          exit 1

  # Section text cannot travel through the repository: dose_source_sections_v3
  # requires section_text, and the attestation carries hashes only. This job
  # moves the text straight from the archive run into Supabase.
  #
  # Separate from archive for the same reason attest is: the Supabase service
  # key must never be held by the job that fetches and parses untrusted
  # external documents. This job makes no network requests to those sources and
  # runs no parser - it reads what archive already produced.
  ingest:
    needs: archive
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download source archive
        uses: actions/download-artifact@v4
        with:
          name: drx-batch2-source-archive

      - name: Ingest provenance into V3
        env:
          MEDINDEX_SUPABASE_URL: ${{ secrets.MEDINDEX_SUPABASE_URL }}
          MEDINDEX_SUPABASE_SECRET_KEY: ${{ secrets.MEDINDEX_SUPABASE_SECRET_KEY }}
          DRX_ARCHIVE_DIR: artifacts/drx-batch2-raw
        run: node scripts/ingest-drx-v3-sections.js
