name: Finalize column picker viewport

on:
  push:
    paths:
      - .github/workflows/finalize-column-picker-viewport.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden picker geometry and cache revision
        shell: python {0}
        run: |
          from pathlib import Path

          css_path = Path('registry-column-picker-tailwind.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace(
              'html[data-mi-page="barnat"] .col-picker {\n  isolation: isolate;',
              'html[data-mi-page="barnat"] .col-picker {\n  position: relative;\n  isolation: isolate;',
              1,
          )
          css = css.replace(
              'html[data-mi-page="barnat"] #colPanel.col-panel {\n  --cp-slate-50:',
              'html[data-mi-page="barnat"] #colPanel.col-panel {\n  box-sizing: border-box !important;\n  --cp-slate-50:',
              1,
          )
          css = css.replace(
              '  transform-origin: top right;\n  z-index: 1900 !important;',
              '  transform-origin: top right;\n  translate: var(--mi-column-picker-shift-x, 0px) 0;\n  z-index: 1900 !important;',
              1,
          )
          css_path.write_text(css, encoding='utf-8')

          js_path = Path('registry-column-picker-tailwind.js')
          js = js_path.read_text(encoding='utf-8')
          js = js.replace('column-picker-tailwind-20260805-1', 'column-picker-tailwind-20260805-2')
          marker = '  function syncOpenState() {'
          helper = '\n'.join([
              '  function keepPanelInsideViewport(root) {',
              "    if (!root || !root.classList.contains('open')) return;",
              "    root.style.setProperty('--mi-column-picker-shift-x', '0px');",
              "    if (window.matchMedia('(max-width: 640px)').matches) return;",
              '    requestAnimationFrame(() => {',
              "      if (!root.classList.contains('open')) return;",
              '      const rect = root.getBoundingClientRect();',
              '      const margin = 12;',
              '      let shift = 0;',
              '      if (rect.left < margin) shift = margin - rect.left;',
              '      else if (rect.right > window.innerWidth - margin) shift = (window.innerWidth - margin) - rect.right;',
              "      root.style.setProperty('--mi-column-picker-shift-x', `${Math.round(shift)}px`);",
              '    });',
              '  }',
              '',
          ])
          if 'function keepPanelInsideViewport' not in js:
              if marker not in js:
                  raise SystemExit('Column picker open-state marker not found.')
              js = js.replace(marker, helper + marker, 1)
          js = js.replace(
              "    document.body?.classList.toggle('mi-column-picker-open', open);\n    if (open) {",
              "    document.body?.classList.toggle('mi-column-picker-open', open);\n    if (open) {\n      keepPanelInsideViewport(root);",
              1,
          )
          js = js.replace(
              "      }\n    }\n  }\n\n  function closePanel",
              "      }\n    } else {\n      root.style.removeProperty('--mi-column-picker-shift-x');\n    }\n  }\n\n  function closePanel",
              1,
          )
          js_path.write_text(js, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('registry-column-picker-tailwind.css?v=20260805-1', 'registry-column-picker-tailwind.css?v=20260805-2')
          index = index.replace('registry-column-picker-tailwind.js?v=20260805-1', 'registry-column-picker-tailwind.js?v=20260805-2')
          index_path.write_text(index, encoding='utf-8')

          test_path = Path('tests/column-picker-tailwind.spec.js')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('column-picker-tailwind-20260805-1', 'column-picker-tailwind-20260805-2')
          test = test.replace('registry-column-picker-tailwind.css?v=20260805-1', 'registry-column-picker-tailwind.css?v=20260805-2')
          test = test.replace('registry-column-picker-tailwind.js?v=20260805-1', 'registry-column-picker-tailwind.js?v=20260805-2')
          test_path.write_text(test, encoding='utf-8')

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check registry-column-picker-tailwind.js
          grep -q 'box-sizing: border-box' registry-column-picker-tailwind.css
          grep -q 'keepPanelInsideViewport' registry-column-picker-tailwind.js
          rm -f .github/workflows/finalize-column-picker-viewport.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry-column-picker-tailwind.css registry-column-picker-tailwind.js index.html tests/column-picker-tailwind.spec.js .github/workflows/finalize-column-picker-viewport.yml
          git commit -m 'Keep the column picker inside every viewport'
          git push origin HEAD:main
