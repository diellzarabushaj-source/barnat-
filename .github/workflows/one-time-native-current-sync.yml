name: One-time native current spreadsheet synchronization

on:
  push:
    paths:
      - .github/workflows/one-time-native-current-sync.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make current dosage spreadsheet native
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          current = '1T7XsfkXLQfEomFL4DmXoA8PheiR6s3Qmu36hTqklOMo'

          sync_path = Path('lib/drive-neon-sync.js')
          sync = sync_path.read_text()
          marker = "  '19ncbnrTJ_w-WQ0msWO9_dUoxjmicSUAz6Nt4sh20gFw|Të gjitha kodet': {"
          addition = f"""  '{current}|KARTELA_BARNAVE': {{
            entityScope:'dosage_cards', keyColumn:'Nr rendor', headerRow:1,
          }},
          '{current}|DOZA_TE_RRITUR': {{
            entityScope:'adult_dosage', keyColumn:'RegimenID', headerRow:1,
          }},
          '{current}|DOZA_PEDIATRIKE': {{
            entityScope:'pediatric_dosage', keyColumn:'RegimenID', headerRow:1,
          }},
          """
          if f"'{current}|KARTELA_BARNAVE'" not in sync:
              if marker not in sync:
                  raise SystemExit('SOURCE_CONFIGS insertion marker missing')
              sync = sync.replace(marker, addition + marker, 1)
              sync_path.write_text(sync)

          api_path = Path('api/drive-sync.js')
          api = api_path.read_text()
          old = """function canonicalPayload(payload = {}) {
            const spreadsheetId = clean(payload.spreadsheetId);
            const sheetName = clean(payload.sheetName);
            if (spreadsheetId === CURRENT_DOSAGE_SPREADSHEET_ID && DOSAGE_SHEETS.has(sheetName)) {
              return { ...payload, spreadsheetId:LEGACY_DOSAGE_SPREADSHEET_ID };
            }
            return payload;
          }
          """
          new = """function canonicalPayload(payload = {}) {
            return payload;
          }
          """
          if old in api:
              api = api.replace(old, new, 1)
              api_path.write_text(api)
          elif new not in api:
              raise SystemExit('canonicalPayload block missing')

          test_path = Path('tests/drive-neon-sync-test.js')
          test = test_path.read_text().replace('Object.keys(Sync.SOURCE_CONFIGS).length, 6', 'Object.keys(Sync.SOURCE_CONFIGS).length, 9')
          anchor = "assert.equal(Object.keys(Sync.SOURCE_CONFIGS).length, 9);\n"
          extra = "assert.ok(Sync.SOURCE_CONFIGS['1T7XsfkXLQfEomFL4DmXoA8PheiR6s3Qmu36hTqklOMo|KARTELA_BARNAVE']);\nassert.ok(Sync.SOURCE_CONFIGS['1T7XsfkXLQfEomFL4DmXoA8PheiR6s3Qmu36hTqklOMo|DOZA_TE_RRITUR']);\nassert.ok(Sync.SOURCE_CONFIGS['1T7XsfkXLQfEomFL4DmXoA8PheiR6s3Qmu36hTqklOMo|DOZA_PEDIATRIKE']);\n"
          if extra not in test:
              if anchor not in test:
                  raise SystemExit('drive sync test anchor missing')
              test = test.replace(anchor, anchor + extra, 1)
          test_path.write_text(test)
          PY
          git rm .github/workflows/one-time-native-current-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/drive-neon-sync.js api/drive-sync.js tests/drive-neon-sync-test.js
          git commit -m 'Use current dosage spreadsheet natively'
          git push origin HEAD:main
