name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request and leave your feedback as a single
            summary comment via `gh pr comment`. Focus on:

            - Correctness bugs and unhandled edge cases
            - Clinical-safety regressions: dosage calculations, unit
              conversions, pediatric guards, and anything that could surface
              a wrong dose, ICD code, or prescription to a clinician
            - Security concerns, especially around auth, secrets, and any
              handling of patient data
            - Performance problems in registry/table rendering paths
            - Test coverage for the changed behavior

            Be constructive and concise. Point at specific files and lines.
            If the diff looks good, say so briefly rather than inventing
            problems.

          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
