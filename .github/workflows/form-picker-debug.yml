name: Clinical form picker debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Capture tests
        shell: bash
        run: |
          set +e
          npm test > form-picker-test-output.txt 2>&1
          echo "exit_code=$?" >> form-picker-test-output.txt
          tail -120 form-picker-test-output.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: form-picker-test-output
          path: form-picker-test-output.txt
