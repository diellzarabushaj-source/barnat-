<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DRx">
  <title>DRx</title>
  <!--
    Shenja DRx: një "D" ku një prizë futet në folenë e gropës.
    Sfondi është transparent dhe ngjyra vjen nga `currentColor`, prandaj e njëjta
    skedë punon mbi të bardhë, mbi navy dhe brenda faqes, pa asnjë variant të dytë
    dhe pa asnjë piksel raster.

    Priza (`tab`) është më e lartë se foleja (`notch`), prandaj shtylla e "D"-së
    mbetet e plotë sipër dhe poshtë prerjes — forma qëndron e lidhur në çdo madhësi.
  -->
  <mask id="drx-cut">
    <rect width="512" height="512" fill="#000"/>
    <!-- Trupi i "D"-së -->
    <path fill="#fff" d="M205 105 H266 A145 145 0 0 1 266 395 H205 A20 20 0 0 1 185 375 V125 A20 20 0 0 1 205 105 Z"/>
    <!-- Priza që del majtas -->
    <rect x="112" y="208" width="98" height="82" rx="22" fill="#fff"/>
    <!-- Gropa e "D"-së -->
    <path fill="#000" d="M257 161 H292 A95 95 0 0 1 292 342 H257 A10 10 0 0 1 247 332 V171 A10 10 0 0 1 257 161 Z"/>
    <!-- Foleja: prerja që lidh gropën me prizën -->
    <rect x="210" y="216" width="50" height="66" rx="9" fill="#000"/>
  </mask>
  <rect width="512" height="512" fill="currentColor" mask="url(#drx-cut)"/>
</svg>
