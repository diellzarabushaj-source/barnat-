<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320"><rect width="1200" height="320" rx="22" fill="#f6f9fc"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="28" y="26" width="1144" height="72" rx="18" fill="#fff" stroke="#dfe6ef"/><rect x="48" y="42" width="790" height="40" rx="10" fill="#fff" stroke="#d4dee8"/><circle cx="72" cy="62" r="7" fill="none" stroke="#7a8799" stroke-width="2"/><path d="M77 67l6 6" stroke="#7a8799" stroke-width="2" stroke-linecap="round"/><text x="96" y="68" fill="#8a97aa" font-size="14">Kërko urgjencën, ICD ose fjalën kyçe...</text><rect x="858" y="42" width="286" height="40" rx="10" fill="#fff" stroke="#138789" stroke-width="1.6"/><text x="878" y="68" fill="#172033" font-size="14">Të gjitha kategoritë</text><text x="28" y="138" font-size="12" fill="#667085" font-weight="700">Prioriteti klinik</text><g font-size="13" text-anchor="middle"><rect x="28" y="158" width="128" height="44" rx="12" fill="#edf3ff" stroke="#c5d6f7"/><text x="92" y="185" fill="#315ecb">Të gjitha · 10</text><rect x="170" y="158" width="110" height="44" rx="12" fill="#fff" stroke="#dfe5ee"/><text x="225" y="185" fill="#59657a">Kritike · 9</text><rect x="294" y="158" width="176" height="44" rx="12" fill="#fff" stroke="#dfe5ee"/><text x="382" y="185" fill="#59657a">Shumë urgjente · 0</text><rect x="484" y="158" width="132" height="44" rx="12" fill="#edf3ff" stroke="#c5d6f7"/><text x="550" y="185" fill="#315ecb">Urgjente · 1</text></g><text x="28" y="246" font-size="16" fill="#101828" font-weight="700">Kërkim i menjëhershëm, pa humbur kontekstin.</text><text x="28" y="276" font-size="13.5" fill="#667085">Filtrat dhe kategoritë e çojnë përdoruesin direkt te gjendja klinike që i duhet.</text></g></svg>