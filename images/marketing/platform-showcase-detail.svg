<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600"><rect width="980" height="600" rx="22" fill="#f6f9fc"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="26" y="26" width="928" height="548" rx="20" fill="#fff" stroke="#e1e7ef"/><text x="58" y="92" font-size="42" fill="#111827" font-weight="760" letter-spacing="-1.1">Status epileptik</text><text x="58" y="140" font-size="42" fill="#111827" font-weight="760" letter-spacing="-1.1">konvulsiv — i rrituri</text><g font-size="11.5"><rect x="58" y="168" width="62" height="28" rx="14" fill="#f3f6fb" stroke="#dfe5ee"/><text x="89" y="187" text-anchor="middle" fill="#5e6b80">G41.9</text><rect x="128" y="168" width="166" height="28" rx="14" fill="#f3f6fb" stroke="#dfe5ee"/><text x="211" y="187" text-anchor="middle" fill="#5e6b80">Neurologji / Konvulsione</text><rect x="304" y="168" width="68" height="28" rx="14" fill="#fff1f1" stroke="#f5cece"/><text x="338" y="187" text-anchor="middle" fill="#c54242">critical</text><rect x="382" y="168" width="98" height="28" rx="14" fill="#fff7e8" stroke="#f2d79c"/><text x="431" y="187" text-anchor="middle" fill="#9a6b00">Për verifikim</text></g><text x="58" y="250" font-size="16" fill="#667085">Kriza konvulsive që zgjat 5 minuta ose më shumë trajtohet si status epileptik</text><text x="58" y="280" font-size="16" fill="#667085">dhe kërkon resuscitim, benzodiazepinë të hershme dhe transport emergjent.</text><text x="58" y="310" font-size="16" fill="#667085">Hipoglikemia, eklampsia dhe shkaqe të tjera të kthyeshme kërkohen paralelisht.</text><rect x="58" y="356" width="864" height="70" rx="18" fill="#f0f4fb" stroke="#e0e6ef"/><rect x="350" y="365" width="280" height="52" rx="13" fill="#fff"/><text x="200" y="397" font-size="14" fill="#718096" text-anchor="middle">Përmbledhje</text><text x="490" y="397" font-size="14" fill="#14213d" text-anchor="middle" font-weight="700">Mëso</text><text x="780" y="397" font-size="14" fill="#718096" text-anchor="middle">Mësimi i plotë + flashcards</text><rect x="58" y="458" width="240" height="70" rx="16" fill="#f6fbfa" stroke="#cfe8e5"/><circle cx="88" cy="493" r="13" fill="#e4f6f3"/><path d="M82 493l5 5 9-11" fill="none" stroke="#128385" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="489" font-size="13" fill="#128385" font-weight="700">Statusi klinik</text><text x="116" y="510" font-size="12" fill="#667085">Shiko detajet</text></g></svg>