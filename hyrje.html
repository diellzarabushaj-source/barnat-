<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hyr | DRx</title>
<meta name="description" content="Hyr në hapësirën klinike DRx.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/brand/drx-icon-silver.svg" type="image/svg+xml">
<link rel="preload" href="fonts/inter-latin-variable-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="landing.css">
<link rel="stylesheet" href="drx-pages.css">
</head>
<body class="lp lp-auth">
<div class="lp-scrollbg" aria-hidden="true"></div>
<div class="lp-mesh" aria-hidden="true"></div>

<main class="au-wrap">
  <a class="au-brand" href="landing.html" aria-label="DRx — faqja hyrëse"><img class="drx-logo__img" src="/brand/drx-horizontal-dark.svg" alt="DRx" width="122" height="36" decoding="async"><span class="lp-sr">DRx</span></a>

  <section class="au-card">
    <h1>Hyr në DRx</h1>
    <p class="au-card__sub">Hapësira jote klinike të pret aty ku e le.</p>

    <form class="au-form" id="signinForm" method="post" action="/api/auth" autocomplete="on" novalidate>
      <div class="au-field">
        <label class="au-label" for="email">Email</label>
        <input class="au-input" id="email" name="email" type="email" inputmode="email"
               autocomplete="email" autocapitalize="none" spellcheck="false"
               placeholder="emri@klinika.com" required aria-describedby="emailError">
        <p class="au-error" id="emailError" role="alert" hidden></p>
      </div>

      <div class="au-field">
        <div class="au-field__row">
          <label class="au-label" for="password">Fjalëkalimi</label>
          <a class="au-hint" href="recovery.html">E harrove?</a>
        </div>
        <input class="au-input" id="password" name="password" type="password"
               autocomplete="current-password" autocapitalize="none" spellcheck="false"
               minlength="6" maxlength="128" required aria-describedby="passwordError">
        <p class="au-error" id="passwordError" role="alert" hidden></p>
      </div>

      <label class="au-check">
        <input type="checkbox" name="remember" value="1" checked>
        <span>Më mbaj të kyçur në këtë pajisje</span>
      </label>

      <button class="lp-btn lp-btn--primary au-submit" type="submit">Hyr</button>
    </form>

    <div class="au-divider">ose</div>
    <a class="au-alt" href="login.html">
      <svg width="17" height="17" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285f4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.5h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.6Z"/>
        <path fill="#34a853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18Z"/>
        <path fill="#fbbc05" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8l3-2.3Z"/>
        <path fill="#ea4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6Z"/>
      </svg>
      Vazhdo me Google
    </a>

    <p class="au-foot">Nuk ke llogari? <a href="regjistrohu.html">Regjistrohu</a></p>
  </section>

  <p class="au-legal">
    Duke hyrë, pranon që DRx është mjet mbështetës dhe nuk zëvendëson gjykimin klinik.
  </p>
</main>
</body>
</html>
