<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1700" viewBox="0 0 1800 1700">
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
<style>.t{font:700 30px Arial,sans-serif;fill:#111}.s{font:20px Arial,sans-serif;fill:#111}.c{text-anchor:middle}.a{stroke:#222;stroke-width:3;fill:none;marker-end:url(#m)}.yn{font:700 18px Arial,sans-serif;fill:#111}</style></defs>
<rect width="1800" height="1700" fill="white"/>
<text x="900" y="42" class="t c">Transporti dhe menaxhimi i hipotermisë aksidentale</text>
<rect x="620" y="75" width="560" height="80" rx="10" fill="#f2eef9" stroke="#444" stroke-width="2"/><text x="900" y="102" class="s c">Trungu i pacientit ndihet i ftohtë në ekzaminim</text><text x="900" y="124" class="s c">ose temperatura qendrore është &lt;35°C?</text>
<path d="M900 155 L900 205" class="a"/>
<rect x="750" y="205" width="300" height="65" rx="10" fill="#fff0e8" stroke="#444" stroke-width="2"/><text x="900" y="232" class="s c">Ka shenja vitale?</text>
<text x="590" y="300" class="yn c">PO</text><text x="1210" y="300" class="yn c">JO</text>
<path d="M750 237 L420 330" class="a"/><path d="M1050 237 L1380 330" class="a"/>
<rect x="120" y="330" width="600" height="110" rx="10" fill="#edf7ef" stroke="#444" stroke-width="2"/><text x="420" y="357" class="s c">HT I, II ose III</text><text x="420" y="379" class="s c">Ngrohje aktive e jashtme dhe minimalisht invazive;</text><text x="420" y="401" class="s c">lëvizje minimale e kujdesshme; menaxhim i rrugëve</text><text x="420" y="423" class="s c">të frymëmarrjes nëse kërkohet.</text>
<rect x="1080" y="330" width="600" height="115" rx="10" fill="#ffe9e6" stroke="#444" stroke-width="2"/><text x="1380" y="357" class="s c">HT IV — arrest kardiak</text><text x="1380" y="379" class="s c">Fillo CPR; mos e vono transportin.</text><text x="1380" y="401" class="s c">Parandalo humbjen e mëtejshme të nxehtësisë;</text><text x="1380" y="423" class="s c">rrugët e frymëmarrjes + deri 3 doza barna/defibrilim.</text>
<path d="M420 440 L420 505" class="a"/>
<rect x="145" y="505" width="550" height="115" rx="10" fill="#fff7df" stroke="#444" stroke-width="2"/><text x="420" y="532" class="s c">Vetëdije e dëmtuar?</text><text x="420" y="554" class="s c">Traumë, komorbiditete ose dyshim</text><text x="420" y="576" class="s c">për hipotermi sekondare?</text>
<text x="215" y="650" class="yn c">JO për të gjitha</text><text x="610" y="650" class="yn c">PO për ndonjërën</text>
<path d="M300 620 L300 710" class="a"/><path d="M560 620 L720 710" class="a"/>
<rect x="95" y="710" width="410" height="115" rx="10" fill="#edf7ef" stroke="#444" stroke-width="2"/><text x="300" y="737" class="s c">HT I</text><text x="300" y="759" class="s c">Ambient dhe veshje të ngrohta;</text><text x="300" y="781" class="s c">pije të ëmbla të ngrohta;</text><text x="300" y="803" class="s c">lëvizje aktive.</text>
<rect x="555" y="710" width="500" height="155" rx="10" fill="#edf7ef" stroke="#444" stroke-width="2"/><text x="805" y="737" class="s c">HT II/III</text><text x="805" y="759" class="s c">Izolim i plotë, pozicion horizontal,</text><text x="805" y="781" class="s c">paketa/batanije të ngrohta ose ajër të detyruar,</text><text x="805" y="803" class="s c">lëngje IV të ngrohta; monitorim kardiak</text><text x="805" y="825" class="s c">dhe i temperaturës qendrore; kujdes me lëvizjet.</text>
<path d="M1380 445 L1380 505" class="a"/>
<rect x="1090" y="505" width="580" height="145" rx="10" fill="#fff7df" stroke="#444" stroke-width="2"/><text x="1380" y="532" class="s c">A ka shkak alternativ para ftohjes?</text><text x="1380" y="554" class="s c">Arrest para ftohjes / traumë madhore /</text><text x="1380" y="576" class="s c">arrest normotermik të dëshmuar /</text><text x="1380" y="598" class="s c">varrim në ortek &lt;35 min.</text>
<text x="1160" y="680" class="yn c">PO</text><text x="1550" y="680" class="yn c">JO</text>
<path d="M1225 650 L1130 735" class="a"/><path d="M1510 650 L1510 735" class="a"/>
<rect x="930" y="735" width="390" height="90" rx="10" fill="#ffe9e6" stroke="#444" stroke-width="2"/><text x="1125" y="762" class="s c">Konsidero ndërprerjen</text><text x="1125" y="784" class="s c">e CPR-së.</text>
<rect x="1350" y="735" width="360" height="100" rx="10" fill="#eaf1ff" stroke="#444" stroke-width="2"/><text x="1530" y="762" class="s c">Vlerëso nevojën për</text><text x="1530" y="784" class="s c">ECMO/CPB.</text>
<path d="M1530 835 L1530 895" class="a"/>
<rect x="1260" y="895" width="510" height="180" rx="10" fill="#eaf1ff" stroke="#444" stroke-width="2"/><text x="1515" y="922" class="s c">Kritere të burimit për ECMO/CPB:</text><text x="1515" y="944" class="s c">temperaturë qendrore &lt;32°C; K &lt;12 mmol/L;</text><text x="1515" y="966" class="s c">paqëndrueshmëri kardiake para spitalit;</text><text x="1515" y="988" class="s c">SBP &lt;90 mmHg; aritmi ventrikulare;</text><text x="1515" y="1010" class="s c">temperaturë qendrore &lt;28°C.</text>
<path d="M1515 1075 L1515 1135" class="a"/>
<rect x="1250" y="1135" width="530" height="195" rx="10" fill="#ffe9e6" stroke="#444" stroke-width="2"/><text x="1515" y="1162" class="s c">HT IV — MOS e ndërprit CPR-në</text><text x="1515" y="1184" class="s c">Transport në qendër ECMO/CPB.</text><text x="1515" y="1206" class="s c">Parandalo humbjen e nxehtësisë; mos ngroh kokën.</text><text x="1515" y="1228" class="s c">Ngrohja aktive gjatë transportit rekomandohet</text><text x="1515" y="1250" class="s c">në burim por mbetet e diskutueshme.</text><text x="1515" y="1272" class="s c">Nëse ECMO s'është e arritshme brenda ~6 h:</text><text x="1515" y="1294" class="s c">ngrohje lokale + lëngje IV të ngrohta ± lavazhe.</text>
<path d="M1515 1330 L1515 1385" class="a"/>
<rect x="1360" y="1385" width="310" height="70" rx="10" fill="#edf7ef" stroke="#444" stroke-width="2"/><text x="1515" y="1412" class="s c">Ringroh deri ≥32°C.</text>
<path d="M1515 1455 L1515 1510" class="a"/>
<rect x="1260" y="1510" width="520" height="120" rx="10" fill="#f2eef9" stroke="#444" stroke-width="2"/><text x="1520" y="1537" class="s c">ROSC?</text><text x="1520" y="1559" class="s c">Nëse PO: kujdes pas arrestit, konsidero</text><text x="1520" y="1581" class="s c">menaxhim të synuar të temperaturës.</text><text x="1520" y="1603" class="s c">Nëse JO: rivlerëso kriteret për vazhdim/ndërprerje.</text>
<rect x="750" y="1100" width="390" height="180" rx="10" fill="#fff7df" stroke="#444" stroke-width="2"/><text x="945" y="1127" class="s c">Shenja të dukshme të vdekjes së pakthyeshme,</text><text x="945" y="1149" class="s c">urdhër i vlefshëm DNR, kushte të pasigurta</text><text x="945" y="1171" class="s c">për shpëtuesin, ose varrim në ortek &gt;35 min</text><text x="945" y="1193" class="s c">me rrugët e frymëmarrjes të mbushura me borë:</text><text x="945" y="1215" class="s c">burimi lejon konsiderimin e ndërprerjes së CPR.</text>
<text x="900" y="1665" class="s c">CPB = bypass kardiopulmonar · ECMO = oksigjenim me membranë ekstrakorporale · HT = hipotermi · ROSC = rikthim i qarkullimit spontan · SBP = presion sistolik</text>
</svg>