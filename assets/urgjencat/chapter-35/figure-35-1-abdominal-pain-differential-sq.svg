" y="1118" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Torsion testikular</text><text x="920" y="1140" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Kalkul ureteral</text>
