<text x="900" y="52" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#111827">Figura 35-1 — Diagnoza diferenciale e dhimbjes akute abdominale sipas lokalizimit</text>
<text x="900" y="86" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#475569">Rikrijuar në shqip nga Tintinalli’s Emergency Medicine Manual, 8th Edition</text>
<rect x="40" y="120" width="820" height="454" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="60" y="150" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111827">Dhimbje difuze</text><text x="60" y="180" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Aneurizëm e aortës (me rrjedhje ose e rupturuar)</text><text x="60" y="202" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Diseksion i aortës</text><text x="60" y="224" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Apendicit (i hershëm)</text><text x="60" y="246" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Obstruksion intestinal</text><text x="60" y="268" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Gastroparezë diabetike</text><text x="60" y="290" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Ethe mesdhetare familjare</text><text x="60" y="312" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Gastroenterit</text><text x="60" y="334" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Helmim me metale të rënda</text><text x="60" y="356" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Angioedemë hereditare</text><text x="60" y="378" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Malaria</text><text x="60" y="400" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Ishemi mezenterike</text><text x="60" y="422" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Çrregullim metabolik (krizë adisoniane, AKA, DKA, porfiri, uremi)</text><text x="60" y="444" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Tërheqje nga narkotikët</text><text x="60" y="466" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Pankreatit</text><text x="60" y="488" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Zorrë e perforuar</text><text x="60" y="510" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Peritonit (nga çdo shkak)</text><text x="60" y="532" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Krizë drepanocitare</text><text x="60" y="554" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Volvulus</text>
<rect x="900" y="120" width="860" height="344" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="920" y="150" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111827">Kuadranti i sipërm i djathtë (RUQ)</text><text x="920" y="180" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Apendicit (retrocekal)</text><text x="920" y="202" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Kolikë biliare</text><text x="920" y="224" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Kolangit</text><text x="920" y="246" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Kolecistit</text><text x="920" y="268" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Sindroma Fitz-Hugh-Curtis</text><text x="920" y="290" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Hepatit</text><text x="920" y="312" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Absces hepatik</text><text x="920" y="334" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Kongjestion hepatik</text><text x="920" y="356" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Herpes zoster</text><text x="920" y="378" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Ishemi miokardiale</text><text x="920" y="400" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Ulçerë duodenale e perforuar</text><text x="920" y="422" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Pneumoni (lob i poshtëm i djathtë)</text><text x="920" y="444" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Emboli pulmonare</text>
<rect x="900" y="500" width="860" height="234" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="920" y="530" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111827">Kuadranti i sipërm i majtë (LUQ)</text><text x="920" y="560" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Ulçerë gastrike</text><text x="920" y="582" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Gastrit</text><text x="920" y="604" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Herpes zoster</text><text x="920" y="626" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Ishemi miokardiale</text><text x="920" y="648" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Pankreatit</text><text x="920" y="670" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Pneumoni (lob i poshtëm i majtë)</text><text x="920" y="692" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Emboli pulmonare</text><text x="920" y="714" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Rupturë/distension i shpretkës</text>
<rect x="40" y="750" width="820" height="476" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="60" y="780" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111827">Kuadranti i poshtëm i djathtë (RLQ)</text><text x="60" y="810" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Aneurizëm e aortës (me rrjedhje ose e rupturuar)</text><text x="60" y="832" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Apendicit</text><text x="60" y="854" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Sëmundja Crohn (ileit terminal)</text><text x="60" y="876" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Divertikulit (cekal)</text><text x="60" y="898" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Shtatzëni ektopike</text><text x="60" y="920" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Endometriozë</text><text x="60" y="942" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Apendagit epiploik</text><text x="60" y="964" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Herpes zoster</text><text x="60" y="986" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Hernie inguinale (e inkarceruar/e stranguluar)</text><text x="60" y="1008" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Kolit ishemik</text><text x="60" y="1030" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Divertikul i Meckel-it</text><text x="60" y="1052" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Mittelschmerz</text><text x="60" y="1074" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Kist ovarian (i rupturuar)</text><text x="60" y="1096" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Torsion ovarian</text><text x="60" y="1118" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Sëmundje inflamatore pelvike</text><text x="60" y="1140" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Absces psoas</text><text x="60" y="1162" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Enterit rajonal</text><text x="60" y="1184" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Torsion testikular</text><text x="60" y="1206" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1f2937">• Kalkul ureteral</text>
