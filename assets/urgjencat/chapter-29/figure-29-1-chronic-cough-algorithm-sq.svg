<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="760" viewBox="0 0 1150 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>.b{fill:#f7f7f7;stroke:#555;stroke-width:1.5} .g{fill:#eef6ee;stroke:#555;stroke-width:1.5} .p{fill:#f4eef8;stroke:#555;stroke-width:1.5} .t{font-family:Arial,sans-serif;font-size:16px;fill:#111} .s{font-family:Arial,sans-serif;font-size:14px;fill:#111} .h{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#111} .l{stroke:#222;stroke-width:2;fill:none;marker-end:url(#a)} .n{stroke:#222;stroke-width:2;fill:none}</style><text class="h" x="575.0" y="30" text-anchor="middle">Vlerësimi i kollës subakute dhe kronike te pacientët ≥15 vjeç</text><rect class="b" x="430" y="70" rx="6" ry="6" width="290" height="60"/><text class="t" x="575.0" y="94" text-anchor="middle">Kollë subakute ose kronike</text><rect class="b" x="410" y="165" rx="6" ry="6" width="330" height="70"/><text class="s" x="575.0" y="189" text-anchor="middle">Anamnezë dhe ekzaminim fizik</text><text class="s" x="575.0" y="208" text-anchor="middle">Radiografi torakale</text><rect class="p" x="145" y="295" rx="6" ry="6" width="250" height="55"/><text class="t" x="270.0" y="319" text-anchor="middle">Kohëzgjatje 3–8 javë</text><rect class="g" x="760" y="295" rx="6" ry="6" width="260" height="55"/><text class="t" x="890.0" y="319" text-anchor="middle">Kohëzgjatje &gt;8 javë</text><rect class="p" x="70" y="395" rx="6" ry="6" width="220" height="55"/><text class="t" x="180.0" y="419" text-anchor="middle">Postinfektive</text><rect class="p" x="330" y="395" rx="6" ry="6" width="220" height="55"/><text class="t" x="440.0" y="419" text-anchor="middle">Jo postinfektive</text><rect class="g" x="760" y="395" rx="6" ry="6" width="260" height="55"/><text class="t" x="890.0" y="419" text-anchor="middle">Sugjerohet etiologjia?</text><