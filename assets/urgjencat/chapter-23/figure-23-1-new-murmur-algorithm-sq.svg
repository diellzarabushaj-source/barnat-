<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>.b{fill:#f7f7f7;stroke:#555;stroke-width:1.5} .g{fill:#eef6ee;stroke:#555;stroke-width:1.5} .p{fill:#f4eef8;stroke:#555;stroke-width:1.5} .t{font-family:Arial,sans-serif;font-size:16px;fill:#111} .s{font-family:Arial,sans-serif;font-size:14px;fill:#111} .h{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#111} .l{stroke:#222;stroke-width:2;fill:none;marker-end:url(#a)} .n{stroke:#222;stroke-width:2;fill:none}</style><text class="h" x="550.0" y="34" text-anchor="middle">Algoritmi për vlerësimin e një murmurimi kardiak të sapozbuluar</text><rect class="p" x="430" y="75" rx="6" ry="6" width="240" height="60"/><text class="t" x="550.0" y="99" text-anchor="middle">Murmurim i ri kardiak</text><rect class="p" x="210" y="175" rx="6" ry="6" width="240" height="60"/><text class="t" x="330.0" y="199" text-anchor="middle">Murmurim sistolik</text><rect class="p" x="700" y="175" rx="6" ry="6" width="240" height="60"/><text class="t" x="820.0" y="199" text-anchor="middle">Murmurim diastolik</text><rect class="g" x="90" y="285" rx="6" ry="6" width="260" height="65"/><text class="t" x="220.0" y="309" text-anchor="middle">Mesosistolik, grada 2</text><rect class="g" x="410" y="285" rx="6" ry="6" width="300" height="90"/><text class="s" x="560.0" y="309" text-anchor="middle">Mesosistolik grada 3</text><text class="s" x="560.0" y="328" text-anchor="middle">I hershëm ose i vonshëm sistolik</text><text class="s" x="560.0" y="347" text-anchor="middle">Holosistolik</text><rect class="g" x="50" y="415" rx="6" ry="6" width="340" height="150"/><text class="s" x="220.0" y="439" text-anchor="middle">Asimptomatik</text><text class="s" x="220.0" y="458" text-anchor="middle">Pa shenja të sëmundjes kardiovaskulare</text><text class="s" x="220.0" y="477" text-anchor="middle">EKG dhe radiografi torakale normale</text><text class="s" x="220.0" y="496" text-anchor="middle">Intensiteti nuk rritet me Valsalva</text><text class="s" x="220.0" y="515" text-anchor="middle">ose në këmbë</text><rect class="g" x="430" y="415" rx="6" ry="6" width="360" height="150"/><text class="s" x="610.0" y="439" text-anchor="middle">Simptomatik</text><text class="s" x="610.0" y="458" text-anchor="middle">Shenja të sëmundjes kardiovaskulare</text><text class="s" x="610.0" y="477" text-anchor="middle">EKG ose radiografi torakale anormale</text><text class="s" x="610.0" y="496" text-anchor="middle">Intensiteti rritet me Valsalva</text><text class="s" x="610.0" y="515" text-anchor="middle">ose në këmbë</text><rect class="p" x="95" y="610" rx="6" ry="6" width="250" height="55"/><text class="t" x="220.0" y="634" text-anchor="middle">Pa hetime të mëtejshme</text><rect class="p" x="740" y="610" rx="6" ry="6" width="260" height="55"/><text class="t" x="870.0" y="634" text-anchor="middle">Ekokardiografi</text><path class="l" d="M550,135 L330,175"/><path class="l" d="M550,135 L820,175"/><path class="l" d="M330,235 L220,285"/><path class="l" d="M330,235 L560,285"/><path class="l" d="M220,350 L220,415"/><path class="l" d="M560,375 L610,415"/><path class="l" d="M220,565 L220,610"/><path class="l" d="M610,565 L835,610"/><path class="l" d="M820,235 L835,610"/><path class="l" d="M710,330 L835,610"/></svg>