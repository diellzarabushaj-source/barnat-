<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1800" viewBox="0 0 1500 1800"><style>
text{font-family:Arial,sans-serif;fill:#111}.h{font-size:28px;font-weight:700}.s{font-size:20px}.sm{font-size:17px}.box{fill:#f8f2ee;stroke:#555;stroke-width:2}.b2{fill:#eef5ff;stroke:#4e6682;stroke-width:2}.b3{fill:#f3eef8;stroke:#7b5c93;stroke-width:2}.a{stroke:#222;stroke-width:3;fill:none;marker-end:url(#m)}.lab{font-size:19px;font-weight:700}</style><rect width="1500" height="1800" fill="white"/>
<text x="750" y="50" text-anchor="middle" class="h">Diagrami Lund-Browder për vlerësimin e sipërfaqes së djegur</text>
<text x="390" y="100" text-anchor="middle" class="lab">Përpara</text><text x="1110" y="100" text-anchor="middle" class="lab">Prapa</text>
<!-- silhouettes -->
<circle cx="390" cy="190" r="52" fill="#ead2bf" stroke="#555"/><rect x="335" y="245" width="110" height="290" rx="48" fill="#e7d5c5" stroke="#555"/>
<rect x="245" y="255" width="70" height="300" rx="30" fill="#e6b3a6" stroke="#555"/><rect x="465" y="255" width="70" height="300" rx="30" fill="#e6b3a6" stroke="#555"/>
<rect x="335" y="535" width="50" height="390" rx="22" fill="#e6a99e" stroke="#555"/><rect x="395" y="535" width="50" height="390" rx="22" fill="#e6a99e" stroke="#555"/>
<circle cx="1110" cy="190" r="52" fill="#ead2bf" stroke="#555"/><rect x="1055" y="245" width="110" height="290" rx="48" fill="#e7d5c5" stroke="#555"/>
<rect x="965" y="255" width="70" height="300" rx="30" fill="#e6b3a6" stroke="#555"/><rect x="1185" y="255" width="70" height="300" rx="30" fill="#e6b3a6" stroke="#555"/>
<rect x="1055" y="535" width="50" height="390" rx="22" fill="#e6a99e" stroke="#555"/><rect x="1115" y="535" width="50" height="390" rx="22" fill="#e6a99e" stroke="#555"/>
<!-- labels -->
<text x="390" y="188" text-anchor="middle" class="lab">A</text><text x="1110" y="188" text-anchor="middle" class="lab">A</text>
<text x="280" y="350" text-anchor="middle" class="lab">2</text><text x="500" y="350" text-anchor="middle" class="lab">2</text>
<text x="390" y="390" text-anchor="middle" class="lab">13</text><text x="1110" y="390" text-anchor="middle" class="lab">13</text>
<text x="360" y="675" text-anchor="middle" class="lab">B</text><text x="420" y="675" text-anchor="middle" class="lab">B</text>
<text x="1080" y="675" text-anchor="middle" class="lab">B</text><text x="1140" y="675" text-anchor="middle" class="lab">B</text>
<text x="360" y="815" text-anchor="middle" class="lab">C</text><text x="420" y="815" text-anchor="middle" class="lab">C</text>
<text x="1080" y="815" text-anchor="middle" class="lab">C</text><text x="1140" y="815" text-anchor="middle" class="lab">C</text>
<text x="750" y="1010" text-anchor="middle" class="lab">Përqindjet relative të zonave që ndryshojnë me rritjen (mosha në vite)</text>
<line x1="150" y1="1040" x2="1350" y2="1040" stroke="#222" stroke-width="2"/>
<text x="430" y="1080" class="lab">Zona</text><text x="660" y="1080" class="lab">0</text><text x="760" y="1080" class="lab">1</text><text x="860" y="1080" class="lab">5</text><text x="960" y="1080" class="lab">10</text><text x="1070" y="1080" class="lab">15</text><text x="1200" y="1080" class="lab">I rritur</text>
<line x1="150" y1="1100" x2="1350" y2="1100" stroke="#222"/>
<text x="170" y="1150" class="s">A: gjysma e kokës</text><text x="660" y="1150" class="s">9½</text><text x="760" y="1150" class="s">8½</text><text x="860" y="1150" class="s">6½</text><text x="960" y="1150" class="s">5½</text><text x="1070" y="1150" class="s">4½</text><text x="1200" y="1150" class="s">3½</text>
<text x="170" y="1200" class="s">B: gjysma e kofshës</text><text x="660" y="1200" class="s">2¾</text><text x="760" y="1200" class="s">3¼</text><text x="860" y="1200" class="s">4</text><text x="960" y="1200" class="s">4¼</text><text x="1070" y="1200" class="s">4½</text><text x="1200" y="1200" class="s">4¾</text>
<text x="170" y="1250" class="s">C: gjysma e kërcirit</text><text x="660" y="1250" class="s">2½</text><text x="760" y="1250" class="s">2½</text><text x="860" y="1250" class="s">2¾</text><text x="960" y="1250" class="s">3</text><text x="1070" y="1250" class="s">3¼</text><text x="1200" y="1250" class="s">3½</text>
<line x1="150" y1="1280" x2="1350" y2="1280" stroke="#222"/>
<text x="170" y="1360" class="s">Djegie me trashësi të pjesshme: ______ %</text>
<text x="170" y="1410" class="s">Djegie me trashësi të plotë: ______ %</text>
<text x="170" y="1460" class="lab">Përqindja totale e djegur: ______ %</text>
<text x="750" y="1580" text-anchor="middle" class="sm">A, B dhe C ndryshojnë me moshën; përqindjet e tjera të shënuara në trup mbeten sipas diagramit.</text>
</svg>