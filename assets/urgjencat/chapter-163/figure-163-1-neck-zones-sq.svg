<line class="line" x1="375" y1="410" x2="160" y2="350"/><text class="t s" x="50" y="325">Këndi i</text><text class="t s" x="50" y="352">mandibulës</text>
<line class="line" x1="495" y1="520" x2="160" y2="470"/><text class="t s" x="50" y="450">Kërci</text><text class="t s" x="50" y="477">krikoid</text>
<text class="t s" x="90" y="690">Zona I: nga klavikulat/manubriumi deri te kërci krikoid.</text>
<text class="t s" x="90" y="730">Zona II: nga kërci krikoid deri te këndi i mandibulës.</text>
<text class="t s" x="90" y="770">Zona III: nga këndi i mandibulës deri te baza e kafkës.</text>
