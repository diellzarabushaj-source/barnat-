<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker><style>.b{fill:#fff;stroke:#444;stroke-width:2;rx:10}.h{fill:#fff0e8}.p{fill:#f3eef9}.g{fill:#edf7ef}.t{font: 28px Arial,sans-serif;fill:#111}.s{font: 19px Arial,sans-serif;fill:#111}.c{text-anchor:middle;dominant-baseline:middle}.l{stroke:#222;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1600" height="1280" fill="white"/>
<text x="800" y="35" class="t c" font-weight="700">Menaxhimi klinik pas gëlltitjes së hekurit</text>
<rect x="690" y="80" width="220" height="60" class="b h"/><text x="800" y="110" class="s c">Hekur i gëlltitur</text>
<path d="M800 140 V185" class="l"/><path d="M800 185 H260 V230" class="l"/><path d="M800 185 V230" class="l"/><path d="M800 185 H1280 V230" class="l"/>
<rect x="110" y="230" width="300" height="70" class="b p"/><text x="260" y="265" class="s c">Asimptomatik</text>
<rect x="650" y="230" width="300" height="70" class="b h"/><text x="800" y="250" class="s c">Vetëm simptoma</text><text x="800" y="280" class="s c">gastrointestinale</text>
<rect x="1130" y="230" width="300" height="70" class="b g"/><text x="1280" y="265" class="s c">Toksicitet sistemik</text>
<path d="M260 300 V350" class="l"/><rect x="120" y="350" width="280" height="75" class="b p"/><text x="260" y="387" class="s c">Sasia e gëlltitur</text>
<path d="M260 425 V470" class="l"/><text x="160" y="458" class="s c">&lt;20 mg/kg</text><text x="360" y="458" class="s c">20–60 mg/kg ose e panjohur</text>
<rect x="120" y="500" width="280" height="120" class="b p"/><text x="260" y="530" class="s c">Konsidero radiografi abdominale</text><text x="260" y="565" class="s c">dhe dekontaminim GI</text>
<path d="M800 300 V500" class="l"/><rect x="585" y="500" width="400" height="180" class="b h"/><text x="785" y="530" class="s c">Reanimim me lëngje</text><text x="785" y="565" class="s c">Vlerëso acid-bazën</text><text x="785" y="600" class="s c">Radiografi abdominale</text><text x="785" y="635" class="s c">Konsidero dekontaminim GI dhe antiemetikë</text>
<path d="M1280 300 V390" class="l"/><rect x="1050" y="390" width="400" height="210" class="b g"/><text x="1250" y="420" class="s c">Stabilizo pacientin</text><text x="1250" y="455" class="s c">Reanimim me lëngje; vlerëso acid-bazën</text><text x="1250" y="490" class="s c">Merr hekurin serik dhe radiografi abdominale</text><text x="1250" y="525" class="s c">Konsidero dekontaminim GI</text><text x="1250" y="560" class="s c">Konsidero antiemetikë</text>
<path d="M785 680 V745" class="l"/><rect x="605" y="745" width="360" height="90" class="b h"/><text x="785" y="775" class="s c">Merr hekurin serik</text><text x="785" y="808" class="s c">4 h pas gëlltitjes</text>
<rect x="90" y="745" width="350" height="115" class="b p"/><text x="265" y="775" class="s c">&lt;500 µg/dL ose i padisponueshëm</text><text x="265" y="810" class="s c">DHE status acid-bazë normal</text><text x="265" y="842" class="s c">dhe pacient asimptomatik</text>
<rect x="1080" y="745" width="350" height="115" class="b h"/><text x="1255" y="775" class="s c">&gt;500 µg/dL OSE acidozë metabolike</text><text x="1255" y="810" class="s c">OSE simptoma persistente / të reja</text>
<path d="M265 860 V925" class="l"/><rect x="130" y="925" width="270" height="75" class="b p"/><text x="265" y="947" class="s c">Asimptomatik në 6 h</text><text x="265" y="975" class="s c">→ dalje</text>
<path d="M1255 860 V900" class="l"/><rect x="1080" y="900" width="350" height="90" class="b g"/><text x="1255" y="930" class="s c">Merr urinën bazale</text><text x="1255" y="963" class="s c">Fillo deferoksaminë IV</text>
<path d="M1255 990 V1035" class="l"/><rect x="1120" y="1035" width="270" height="70" class="b g"/><text x="1255" y="1070" class="s c">Urina e ngjyrosur?</text>
<path d="M1120 1070 H900" class="l"/><path d="M1390 1070 H1480 V1150 H1190" class="l"/>
<rect x="700" y="1035" width="200" height="70" class="b g"/><text x="800" y="1070" class="s c">Klinikisht stabil?</text>
<rect x="560" y="1150" width="260" height="60" class="b g"/><text x="690" y="1180" class="s c">Ndalo deferoksaminën</text>
<rect x="1090" y="1150" width="430" height="60" class="b g"/><text x="1305" y="1180" class="s c">Vazhdo deferoksaminën + kujdes mbështetës</text>
</svg>