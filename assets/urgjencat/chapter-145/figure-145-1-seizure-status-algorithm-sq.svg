<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350"><defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
<style>.h{font:700 28px Arial,sans-serif;fill:#111}.b{font:700 17px Arial,sans-serif;fill:#111}.s{font:15px Arial,sans-serif;fill:#111}.sm{font:13px Arial,sans-serif;fill:#111}.q{fill:#fff0e8;stroke:#d58c6c;stroke-width:1.5}.a{fill:#edf6ef;stroke:#6f9b78;stroke-width:1.5}.c{fill:#eef2fb;stroke:#7186aa;stroke-width:1.5}.ln{stroke:#333;stroke-width:2;fill:none;marker-end:url(#m)}</style></defs><rect width="1800" height="1350" fill="white"/>
<text x="900" y="45" class="h" text-anchor="middle">Menaxhimi i konvulsioneve aktive dhe statusit epileptik</text>
<rect x="110" y="100" width="300" height="105" rx="7" class="q"/><text x="260" y="128" class="b" text-anchor="middle">Konvulsion aktiv 0–5</text><text x="260" y="148" class="s" text-anchor="middle">minuta</text>
<rect x="480" y="85" width="820" height="150" rx="7" class="c"/><text x="494" y="112" class="s">•</text><text x="512" y="112" class="s">Kujdes mbështetës: akses IV, monitorim, ruaj rrugën e</text><text x="512" y="130" class="s">frymëmarrjes, oksigjen.</text><text x="494" y="154" class="s">•</text><text x="512" y="154" class="s">Kontrollo glukozën në vend dhe jep glukozë IV nëse indikohet.</text><text x="494" y="178" class="s">•</text><text x="512" y="178" class="s">Mbroje pacientin nga lëndimi.</text>
<path d="M260 205 L260 325" class="ln"/>
<rect x="95" y="325" width="330" height="125" rx="7" class="a"/><text x="260" y="353" class="b" text-anchor="middle">Status epileptik i vendosur —</text><text x="260" y="373" class="s" text-anchor="middle">objektivi i trajtimit 5–10 min</text>
<rect x="485" y="325" width="360" height="165" rx="7" class="a"/><text x="665" y="353" class="b" text-anchor="middle">Lorazepam IV: 2 mg deri në 0.1</text><text x="665" y="373" class="s" text-anchor="middle">mg/kg OSE Diazepam IV: 10–20 mg</text>
<text x="900" y="410" class="h" text-anchor="middle">+</text>
<rect x="970" y="300" width="430" height="250" rx="7" class="a"/><text x="1185" y="328" class="b" text-anchor="middle">Një nga këto: Fosphenytoin IV 20 PE/kg me 150</text><text x="1185" y="348" class="s" text-anchor="middle">PE/min; OSE Phenytoin IV 20 mg/kg me 50</text><text x="1185" y="368" class="s" text-anchor="middle">mg/min; OSE Levetiracetam IV 2000–4000 mg</text>
<rect x="1450" y="340" width="230" height="75" rx="7" class="a"/><text x="1565" y="368" class="b" text-anchor="middle">Konsidero intubimin</text>
<path d="M260 450 L260 620" class="ln"/>
<rect x="70" y="620" width="380" height="145" rx="7" class="q"/><text x="260" y="648" class="b" text-anchor="middle">Status epileptik refraktar —</text><text x="260" y="668" class="s" text-anchor="middle">objektivi i trajtimit &lt;30 min</text>
<rect x="500" y="595" width="300" height="210" rx="7" class="q"/><text x="650" y="623" class="b" text-anchor="middle">Midazolam IV: ngarkesë 0.2</text><text x="650" y="643" class="s" text-anchor="middle">mg/kg, pastaj infuzion 0.05–2</text><text x="650" y="663" class="s" text-anchor="middle">mg/kg/orë</text>
<text x="835" y="705" class="h">OSE</text>
<rect x="900" y="595" width="300" height="210" rx="7" class="q"/><text x="1050" y="623" class="b" text-anchor="middle">Propofol IV: 1 mg/kg, pastaj</text><text x="1050" y="643" class="s" text-anchor="middle">1–10 mg/kg/orë; OSE ketaminë 5</text><text x="1050" y="663" class="s" text-anchor="middle">mg/kg/orë</text>
<text x="1235" y="705" class="h">OSE</text>
<rect x="1300" y="595" width="300" height="210" rx="7" class="q"/><text x="1450" y="623" class="b" text-anchor="middle">Phenobarbital IV: 20 mg/kg me</text><text x="1450" y="643" class="s" text-anchor="middle">50–75 mg/min</text>
<rect x="1300" y="855" width="300" height="170" rx="7" class="c"/><text x="1314" y="882" class="s">•</text><text x="1332" y="882" class="s">Intubo pacientin.</text><text x="1314" y="906" class="s">•</text><text x="1332" y="906" class="s">Shtrim në ICU neurologjike.</text><text x="1314" y="930" class="s">•</text><text x="1332" y="930" class="s">Monitorim i vazhdueshëm EEG.</text>
<text x="900" y="1160" class="sm" text-anchor="middle">ICU = njësia e kujdesit intensiv · PE = ekuivalent i fenitoinës · EEG = elektroencefalogram</text>
<text x="900" y="1190" class="sm" text-anchor="middle">Shënim: figura e shtypur jep 150 mg/min për fosfenitoinën; teksti i kapitullit jep 150 PE/min. Figura e rikrijuar sipas burimit.</text></svg>