<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1800" viewBox="0 0 1500 1800"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><style>
text{font-family:Arial,sans-serif;fill:#111}.h{font-size:28px;font-weight:700}.s{font-size:20px}.sm{font-size:17px}.box{fill:#f8f2ee;stroke:#555;stroke-width:2}.b2{fill:#eef5ff;stroke:#4e6682;stroke-width:2}.b3{fill:#f3eef8;stroke:#7b5c93;stroke-width:2}.a{stroke:#222;stroke-width:3;fill:none;marker-end:url(#m)}.lab{font-size:19px;font-weight:700}</style>
<rect width="1500" height="1800" fill="white"/>
<text x="750" y="55" text-anchor="middle" class="h">Algoritmi i ngjarjes së mbytjes</text>
<rect x="460" y="95" width="580" height="190" rx="12" class="box"/>
<text x="750" y="130" text-anchor="middle" class="lab">Kujdesi para spitalit</text>
<text x="750" y="165" text-anchor="middle" class="s">Shpëtim i shpejtë dhe i kujdesshëm</text>
<text x="750" y="197" text-anchor="middle" class="s">Mbrojtje e shtyllës cervikale nëse dyshohet dëmtim</text>
<text x="750" y="229" text-anchor="middle" class="s">CPR sipas indikacionit - transport për të gjithë - oksigjen për të gjithë</text>
<path d="M750 285 L750 350" class="a"/>
<rect x="360" y="350" width="780" height="235" rx="12" class="box"/>
<text x="750" y="388" text-anchor="middle" class="lab">Kujdesi në urgjencë</text>
<text x="750" y="423" text-anchor="middle" class="s">Rrugët e frymëmarrjes / frymëmarrja / qarkullimi</text>
<text x="750" y="455" text-anchor="middle" class="s">Përcakto GCS-në</text>
<text x="750" y="487" text-anchor="middle" class="s">Trajto dëmtimet ose gjendjet shoqëruese</text>
<text x="750" y="519" text-anchor="middle" class="s">p.sh. hipovolemi, hipotermi, konvulsione, infarkt miokardi</text>
<path d="M360 468 L215 468" class="a"/><path d="M1140 468 L1285 468" class="a"/>
<rect x="35" y="405" width="270" height="125" rx="10" class="b3"/>
<text x="170" y="452" text-anchor="middle" class="lab">GCS >=13</text>
<text x="170" y="485" text-anchor="middle" class="s">dhe SaO2 >=95%</text>
<rect x="1195" y="405" width="270" height="125" rx="10" class="b2"/>
<text x="1330" y="452" text-anchor="middle" class="lab">GCS &lt;13</text>
<text x="1330" y="485" text-anchor="middle" class="s">ose SaO2 &lt;95%</text>
<path d="M170 530 L170 650" class="a"/><path d="M1330 530 L1330 650" class="a"/>
<rect x="40" y="650" width="420" height="180" rx="10" class="b3"/>
<text x="250" y="690" text-anchor="middle" class="lab">Rrezik i ulët</text>
<text x="250" y="725" text-anchor="middle" class="s">Pastro shtyllën cervikale</text>
<text x="250" y="757" text-anchor="middle" class="s">Monitoro saturimin e oksigjenit</text>
<text x="250" y="789" text-anchor="middle" class="s">Teste ndihmëse zakonisht nuk duhen</text>
<path d="M250 830 L250 900" class="a"/>
<rect x="85" y="900" width="330" height="70" rx="10" class="b3"/>
<text x="250" y="944" text-anchor="middle" class="lab">Vëzhgo 4-6 orë</text>
<path d="M250 970 L120 1050" class="a"/><path d="M250 970 L390 1050" class="a"/>
<rect x="20" y="1050" width="340" height="250" rx="10" class="b3"/>
<text x="190" y="1090" text-anchor="middle" class="lab">Ekzaminim normal</text>
<text x="190" y="1125" text-anchor="middle" class="s">Nëse saturimi dhe ekzaminimi</text>
<text x="190" y="1157" text-anchor="middle" class="s">pulmonar mbeten normalë,</text>
<text x="190" y="1189" text-anchor="middle" class="s">pacienti mund të dalë në shtëpi.</text>
<rect x="380" y="1050" width="360" height="250" rx="10" class="b3"/>
<text x="560" y="1090" text-anchor="middle" class="lab">Nëse përkeqësohet</text>
<text x="560" y="1125" text-anchor="middle" class="s">SaO2 &lt;95% ose ekzaminim abnormal</text>
<text x="560" y="1157" text-anchor="middle" class="s">me krepitacione, ronke, fishkëllimë</text>
<text x="560" y="1189" text-anchor="middle" class="s">ose retraksione: trajto si GCS &lt;13.</text>
<path d="M740 1175 L990 1175" class="a"/>
<rect x="990" y="650" width="470" height="540" rx="10" class="b2"/>
<text x="1225" y="690" text-anchor="middle" class="lab">Rrezik më i lartë / GCS &lt;13 ose SaO2 &lt;95%</text>
<text x="1225" y="730" text-anchor="middle" class="s">Pastro shtyllën cervikale</text>
<text x="1225" y="762" text-anchor="middle" class="s">Oksigjen shtesë për SaO2 >=95%</text>
<text x="1225" y="794" text-anchor="middle" class="s">Intubim dhe ventilim me presion pozitiv sipas nevojës</text>
<text x="1225" y="826" text-anchor="middle" class="s">(CPAP, PEEP)</text>
<text x="1225" y="875" text-anchor="middle" class="lab">Teste të konsiderohen:</text>
<text x="1225" y="910" text-anchor="middle" class="s">CXR, CBC, elektrolite, glukozë, troponinë I</text>
<text x="1225" y="942" text-anchor="middle" class="s">PT/PTT, analizë urine, CK, mioglobinë urinare</text>
<text x="1225" y="974" text-anchor="middle" class="s">dhe depistim toksikologjik i urinës</text>
<text x="1225" y="1023" text-anchor="middle" class="lab">Monitoro:</text>
<text x="1225" y="1058" text-anchor="middle" class="s">statusin acido-bazik, temperaturën, vëllimin</text>
<text x="1225" y="1090" text-anchor="middle" class="s">(diureza, CVP etj.)</text>
<path d="M1225 1190 L1225 1270" class="a"/>
<rect x="1010" y="1270" width="430" height="150" rx="10" class="b2"/>
<text x="1225" y="1310" text-anchor="middle" class="lab">Shtrim / transport</text>
<text x="1225" y="1345" text-anchor="middle" class="s">Pacienti ka nevojë për shtrim ose transport</text>
<text x="1225" y="1377" text-anchor="middle" class="s">në qendër me monitorim spitalor / ICU.</text>
<text x="750" y="1535" text-anchor="middle" class="sm">CBC = hemogram · CK = kreatin-kinazë · CPAP = presion pozitiv i vazhdueshëm i rrugëve të frymëmarrjes</text>
<text x="750" y="1565" text-anchor="middle" class="sm">CVP = presion venoz qendror · CXR = radiografi toraksi · GCS = Glasgow Coma Scale</text>
<text x="750" y="1595" text-anchor="middle" class="sm">ICU = kujdes intensiv · PEEP = presion pozitiv në fund të ekspirimit · PT/PTT = koha e koagulimit</text>
</svg>